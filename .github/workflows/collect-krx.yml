name: Collect KRX Investor Data

on:
  schedule:
    - cron: '0 7 * * 1-5'    # KST 16:00 (평일)
    - cron: '30 0 * * 1-5'   # KST 09:30 (평일)
  workflow_dispatch:
  push:
    paths:
      - 'collect_all.py'
      - '.github/workflows/collect-krx.yml'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show time
        run: |
          echo "UTC: $(date -u)"
          echo "KST: $(TZ='Asia/Seoul' date)"

      - name: Run KRX collector
        run: python collect_all.py

      - name: Show result
        run: |
          echo "=== data/krx_investor.json ==="
          cat data/krx_investor.json

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/krx_investor.json
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "Auto-update KRX data ($(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST'))"
            git push
          fi

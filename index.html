// === CORS 프록시 자동 래퍼 (GitHub Pages/모바일용) ===
(function(){
  // PC 로컬 실행에서는 프록시 안 씀
  if(location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1'){
    console.log('🏠 로컬 모드 - 프록시 비활성');
    return;
  }
  
  const PROXY = 'https://corsproxy.io/?';
  const TARGETS = [
    'query1.finance.yahoo.com',
    'query2.finance.yahoo.com',
    'data.krx.co.kr',
    'finance.naver.com',
    'openapi.ls-sec.co.kr',
    'www.alphavantage.co'
  ];
  
  function needsProxy(url){
    if(typeof url !== 'string') return false;
    if(url.includes('corsproxy.io')) return false;
    return TARGETS.some(d => url.includes(d));
  }
  
  function proxify(url){
    return needsProxy(url) ? (PROXY + encodeURIComponent(url)) : url;
  }
  
  const originalFetch = window.fetch;
  window.fetch = function(input, init){
    try {
      if(typeof input === 'string' && needsProxy(input)){
        input = proxify(input);
      } else if(input instanceof Request && needsProxy(input.url)){
        input = new Request(proxify(input.url), input);
      }
    } catch(e){ console.warn('proxy wrap error:', e); }
    return originalFetch.call(this, input, init);
  };
  
  console.log('🌐 CORS 프록시 활성:', PROXY);
  console.log('   대상:', TARGETS.join(', '));
})();

  
// === LS증권 토큰 자동 재발급 ===
(async function autoRefreshLSToken(){
  const cfgStr = localStorage.getItem('ls_config');
  if(!cfgStr){ console.log('⚠️ ls_config 없음'); return; }
  let cfg;
  try { cfg = JSON.parse(cfgStr); } catch(e){ return; }
  if(!cfg.appkey || !cfg.appsecret) return;
  const tokenTime = Number(localStorage.getItem('ls_token_time') || 0);
  const ageHours = (Date.now() - tokenTime) / 3600000;
  if(ageHours < 22 && tokenTime > 0 && localStorage.getItem('ls_token')){
    console.log('✅ LS 토큰 유효 ('+ageHours.toFixed(1)+'h 사용)');
    return;
  }
  console.log('🔄 LS 토큰 재발급 중...');
  try{
    const r = await fetch('https://stock-proxy.kgwsw.workers.dev/ls/token?appkey='+cfg.appkey+'&appsecret='+cfg.appsecret);
    const d = await r.json();
    if(d.access_token){
      localStorage.setItem('ls_token', d.access_token);
      localStorage.setItem('ls_token_time', Date.now().toString());
      console.log('✅ LS 토큰 재발급 완료 (유효 '+Math.floor(d.expires_in/3600)+'h)');
    } else { console.log('❌ 토큰 발급 실패:', d); }
  } catch(e){ console.log('❌ 재발급 오류:', e.message); }
})();

// === BSA 일일 로그 CSV 내보내기 ===
window.exportBSALogToCSV = function(){
  const log = JSON.parse(localStorage.getItem('bsa_daily_log')||'[]');
  if(log.length === 0){
    alert('내보낼 데이터가 없습니다. 백테스트를 먼저 실행하세요.');
    return;
  }
  
  const headers = ['날짜','KOSPI30','시장상태','순위','종목명','코드','BSA','BullB섹터','BullB','가속도','섹터','현재가','ret30'];
  const rows = [headers.join(',')];
  
  log.forEach(day => {
    if(day.top5 && day.top5.length > 0){
      day.top5.forEach((stock, idx) => {
        const row = [
          day.date,
          day.kospi30 ?? '',
          day.regime || day.label || '',
          idx + 1,
          '"' + (stock.name||'') + '"',
          stock.code || '',
          stock.bsa ?? '',
          stock.bullBSector ?? '',
          stock.bullB ?? '',
          (stock.accel ?? '').toString().slice(0,8),
          '"' + (stock.sector||'') + '"',
          stock.price ?? '',
          stock.ret30AtRec ?? ''
        ];
        rows.push(row.join(','));
      });
    }
  });
  
  const csv = '\uFEFF' + rows.join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = new Date(Date.now()+9*3600000).toISOString().slice(0,10);
  a.href = url;
  a.download = 'BSA_백테스트_'+today+'.csv';
  a.click();
  URL.revokeObjectURL(url);
  console.log('✅ CSV 내보내기 완료:', log.length+'일치, '+(rows.length-1)+'행');
};
console.log('💡 CSV 내보내기: 콘솔에서 exportBSALogToCSV() 실행');

// === 섹터별 강세 트래킹 ===
window.analyzeSectorTrend = function(days){
  const log = JSON.parse(localStorage.getItem('bsa_daily_log')||'[]');
  if(log.length === 0){
    console.log('❌ 분석할 데이터가 없습니다.');
    return;
  }
  
  const N = days || log.length;
  const recent = log.slice(-N);
  
  // 섹터별 집계
  const sectorStats = {};
  const sectorBSA = {};
  
  recent.forEach(day => {
    if(!day.top5) return;
    day.top5.forEach((stock, idx) => {
      const sector = stock.sector || '미분류';
      if(!sectorStats[sector]){
        sectorStats[sector] = {count:0, top1:0, top3:0, stocks:new Set(), bsaSum:0};
      }
      sectorStats[sector].count++;
      if(idx === 0) sectorStats[sector].top1++;
      if(idx < 3) sectorStats[sector].top3++;
      sectorStats[sector].stocks.add(stock.name);
      sectorStats[sector].bsaSum += (stock.bsa || 0);
    });
  });
  
  // 정렬
  const sorted = Object.entries(sectorStats)
    .map(([sector, s]) => ({
      섹터: sector,
      등장횟수: s.count,
      Top1: s.top1,
      Top3: s.top3,
      평균BSA: (s.bsaSum / s.count).toFixed(1),
      종목수: s.stocks.size,
      종목: Array.from(s.stocks).slice(0,3).join(', ')
    }))
    .sort((a,b) => b.등장횟수 - a.등장횟수);
  
  console.log('=== 섹터별 강세 분석 ('+N+'일) ===');
  console.table(sorted);
  
  // 1위 섹터 강조
  if(sorted[0]){
    const total = recent.length * 5;
    const pct = (sorted[0].등장횟수 / total * 100).toFixed(1);
    console.log('🏆 최강 섹터:', sorted[0].섹터, 
      '('+sorted[0].등장횟수+'/'+total+'회, '+pct+'%)');
  }
  
  return sorted;
};
console.log('💡 섹터 분석: analyzeSectorTrend() 또는 analyzeSectorTrend(7) [최근 7일]');




/* ============================================
   v5: LRU Cache Manager
   ============================================ */
var CacheManager={
  prefix:'sc5_',
  get:function(key,maxAge){
    try{var raw=localStorage.getItem(this.prefix+key);if(!raw)return null;
    var obj=JSON.parse(raw);if(Date.now()-obj.ts>maxAge){localStorage.removeItem(this.prefix+key);return null}
    obj.at=Date.now();try{localStorage.setItem(this.prefix+key,JSON.stringify(obj))}catch(e){}
    return obj.data}catch(e){return null}
  },
  set:function(key,data){
    try{var item=JSON.stringify({ts:Date.now(),at:Date.now(),data:data});
    if(item.length>500000)return;
    try{localStorage.setItem(this.prefix+key,item)}catch(e){this.evict();try{localStorage.setItem(this.prefix+key,item)}catch(e2){}}
    }catch(e){}
  },
  evict:function(){
    var items=[];for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);if(k&&k.startsWith(this.prefix)){
        try{var v=JSON.parse(localStorage.getItem(k));items.push({key:k,at:v.at||v.ts||0})}catch(e){items.push({key:k,at:0})}
    }}
    items.sort(function(a,b){return a.at-b.at});
    var n=Math.max(5,Math.floor(items.length*0.3));
    for(var j=0;j<n&&j<items.length;j++)localStorage.removeItem(items[j].key);
  }
};

var WORKER_BASE='https://stock-proxy.kgwsw.workers.dev';
var GENSPARK_CHAT_URL='https://www.genspark.ai/agents?type=ai_chat';

var StockAPI={
  proxyOnline:null,
  _dartCalls:0, _dartDate:'',
  checkProxy:function(){return fetch(WORKER_BASE+'/ping',{signal:AbortSignal.timeout?AbortSignal.timeout(5000):undefined}).then(function(r){return r.json()}).then(function(j){StockAPI.proxyOnline=j.status==='ok';return true}).catch(function(){StockAPI.proxyOnline=false;return false})},
  fallbackProxies:[function(u){return'https://corsproxy.io/?url='+encodeURIComponent(u)},function(u){return'https://api.allorigins.win/raw?url='+encodeURIComponent(u)}],

  trackDart:function(){var d=new Date().toDateString();if(this._dartDate!==d){this._dartDate=d;this._dartCalls=0}return++this._dartCalls},
  dartCount:function(){return this._dartDate===new Date().toDateString()?this._dartCalls:0},

  fetchKR:function(code,tf,st,en){
    var ck='kr_'+code+'_'+tf+'_'+st;var ma=tf==='day'?300000:3600000;
    var c=CacheManager.get(ck,ma);if(c)return Promise.resolve(c);
    var self=this;
    return fetch(WORKER_BASE+'/kr/chart?symbol='+code+'&timeframe='+tf+'&startTime='+st+'&endTime='+en)
      .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
      .then(function(j){if(j.success&&j.data&&j.data.length>0){CacheManager.set(ck,j.data);return j.data}throw new Error('empty')})
      .catch(function(){return self._fbNaver(code,tf,st,en,ck)})
  },
  _fbNaver:function(code,tf,st,en,ck){
    var self=this;
    var url='https://api.finance.naver.com/siseJson.naver?symbol='+code+'&requestType=1&startTime='+st+'&endTime='+en+'&timeframe='+tf;
    function tryP(i){if(i>=self.fallbackProxies.length)return Promise.resolve(null);
      return fetch(self.fallbackProxies[i](url)).then(function(r){return r.text()}).then(function(t){
        var d=self._parseNaver(t);if(d&&d.length>0){CacheManager.set(ck,d);return d}throw new Error()
      }).catch(function(e){if(String(e).indexOf('429')!==-1)return new Promise(function(r){setTimeout(r,3000)}).then(function(){return tryP(i)});return tryP(i+1)})}
    return tryP(0)
  },
  _parseNaver:function(t){
    if(!t||t.length<50)return null;
    var rows=t.trim().split('\n').slice(1).filter(function(r){return r.trim()&&r.indexOf('날짜')===-1});var res=[];
    for(var i=0;i<rows.length;i++){var c=rows[i].replace(/['"\[\]]/g,'').split(',').map(function(s){return s.trim()}).filter(function(x){return x.length>0});
      if(c.length<6)continue;var raw=c[0].trim();if(raw.length<8)continue;
      res.push({date:raw.substring(0,4)+'-'+raw.substring(4,6)+'-'+raw.substring(6,8),open:+c[1],high:+c[2],low:+c[3],close:+c[4],volume:+c[5]})}
    return res.length>0?res:null
  },
  fetchUS:function(sym,intv,range){
    var ck='us_'+sym+'_'+intv+'_'+range;var ma=intv==='1d'?300000:3600000;
    var c=CacheManager.get(ck,ma);if(c)return Promise.resolve(c);var self=this;
    return fetch(WORKER_BASE+'/us/chart?symbol='+sym+'&interval='+intv+'&range='+range)
      .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
      .then(function(j){var d=self._parseYahoo(j);if(d&&d.length>0){CacheManager.set(ck,d);return d}throw new Error()})
      .catch(function(){
        var url='https://query1.finance.yahoo.com/v8/finance/chart/'+sym+'?interval='+intv+'&range='+range;
        function tryP(i){if(i>=self.fallbackProxies.length)return Promise.resolve(null);
          return fetch(self.fallbackProxies[i](url)).then(function(r){return r.json()}).then(function(j){
            var d=self._parseYahoo(j);if(d&&d.length>0){CacheManager.set(ck,d);return d}throw new Error()
          }).catch(function(){return tryP(i+1)})}
        return tryP(0)
      })
  },
  _parseYahoo:function(j){
    try{if(!j.chart||!j.chart.result||!j.chart.result[0])return null;
    var d=j.chart.result[0],ts=d.timestamp,q=d.indicators.quote[0];if(!ts||!q)return null;var res=[];
    for(var i=0;i<ts.length;i++){var o=q.open[i],h=q.high[i],l=q.low[i],cc=q.close[i];
      if(o==null||h==null||l==null||cc==null)continue;var dt=new Date(ts[i]*1000);
      res.push({date:dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'),
        open:+(+o).toFixed(2),high:+(+h).toFixed(2),low:+(+l).toFixed(2),close:+(+cc).toFixed(2),volume:q.volume[i]||0})}
    return res.length>0?res:null}catch(e){return null}
  },
  // v5: US fundamentals via Yahoo quoteSummary
  fetchUSFund:function(sym){
    var ck='usfund_'+sym;var c=CacheManager.get(ck,86400000);if(c)return Promise.resolve(c);var self=this;
    var url='https://query1.finance.yahoo.com/v10/finance/quoteSummary/'+sym+'?modules=financialData,defaultKeyStatistics';
    function tryP(i){if(i>=self.fallbackProxies.length)return Promise.resolve(null);
      return fetch(self.fallbackProxies[i](url)).then(function(r){return r.json()}).then(function(j){
        var d=self._parseYahooFund(j);if(d){CacheManager.set(ck,d);return d}throw new Error()
      }).catch(function(){return tryP(i+1)})}
    return tryP(0)
  },
  _parseYahooFund:function(j){
    try{var r=j.quoteSummary?j.quoteSummary.result[0]:j;if(!r)return null;
    var fd=r.financialData||{},ks=r.defaultKeyStatistics||{};
    function rv(o){return o&&o.raw!==undefined?o.raw:null}
    var roe=rv(ks.returnOnEquity);var per=rv(ks.forwardPE)||rv(ks.trailingPE);var pbr=rv(ks.priceToBook);
    var opM=rv(fd.operatingMargins);var netM=rv(fd.profitMargins);var revG=rv(fd.revenueGrowth);var earG=rv(fd.earningsGrowth);
    var dte=rv(fd.debtToEquity);var cr=rv(fd.currentRatio);
    return{roe:roe!==null?+(roe*100).toFixed(1):null,per:per!==null?+per.toFixed(1):null,pbr:pbr!==null?+pbr.toFixed(2):null,
      opMargin:opM!==null?+(opM*100).toFixed(1):null,netMargin:netM!==null?+(netM*100).toFixed(1):null,
      revenueGrowth:revG!==null?+(revG*100).toFixed(1):null,earningsGrowth:earG!==null?+(earG*100).toFixed(1):null,
      debtRatio:dte!==null?+dte.toFixed(1):null,currentRatio:cr!==null?+cr.toFixed(2):null,
      opIncomeGrowth:null,source:'yahoo',reportLabel:'Yahoo quoteSummary'}}catch(e){return null}
  }
};

function calcPERPBR(fin,code,currentPrice){
  if(!fin||!currentPrice)return;
  var shares=SHARES_DATA[code];
  if(!shares)return;
  var marketCap=currentPrice*shares;
  if(fin.netIncome&&fin.netIncome>0) fin.per=+(marketCap/fin.netIncome).toFixed(1);
  if(fin.totalEquity&&fin.totalEquity>0) fin.pbr=+(marketCap/fin.totalEquity).toFixed(2);
}

function evalBuyChecklist(data,marketEnv){
  if(!data)return null;
  var checks=[];
  
  // 1. 시장환경
  if(marketEnv&&typeof marketEnv.temperature==='number'){
    var pass1=marketEnv.temperature<=60;
    checks.push({label:'시장환경',pass:pass1,detail:'온도 '+marketEnv.temperature+(pass1?' (안전)':' (과열)'),weight:1});
  }else{
    checks.push({label:'시장환경',pass:null,detail:'미확인 (대시보드 새로고침 필요)',weight:0});
  }
  
  // 2. 위험 경고
  var riskCount=data.riskWarnings?data.riskWarnings.length:0;
  var pass2=riskCount===0;
  checks.push({label:'위험경고',pass:pass2,detail:pass2?'없음':riskCount+'개 발견',weight:1});
  
  // 3. 종합점수 65 이상
  var pass3=data.scores&&data.scores.total>=65;
  checks.push({label:'종합점수',pass:pass3,detail:(data.scores?data.scores.total:'-')+'점 (기준 65+)',weight:1});
  
  // 4. 추세 (12MA)
  var pass4=data.ma12Signal==='골든크로스'||data.ma12Signal==='12MA위';
  checks.push({label:'추세',pass:pass4,detail:data.ma12Signal||'-',weight:1});
  
  // 5. 모멘텀 (RSI 정상)
  var rsi=data.rsi14;
  var pass5=rsi!=null&&rsi>=30&&rsi<=70;
  checks.push({label:'모멘텀',pass:pass5,detail:rsi!=null?'RSI '+rsi+(rsi>70?' 과매수':rsi<30?' 과매도':' 정상'):'-',weight:1});
  
  // 6. 거래량
  var volR=data.volRatio;
  var pass6=volR!=null&&volR>=80;
  checks.push({label:'거래량',pass:pass6,detail:volR!=null?volR+'% '+(pass6?'정상':'부족'):'-',weight:1});
  
  // 7. 재무 (있을 때만 평가)
  if(data.hasFinancial&&data.financial){
    var debt=data.financial.debtRatio;
    var pass7=debt==null||debt<200;
    checks.push({label:'재무건전성',pass:pass7,detail:debt!=null?'부채 '+debt+'%':'데이터없음',weight:1});
  }else{
    checks.push({label:'재무건전성',pass:null,detail:'데이터 없음 (제외)',weight:0});
  }
  
  // 8. 다이버전스 경고
  var pass8=data.rsiDivergence!=='bearish';
  checks.push({label:'다이버전스',pass:pass8,detail:data.rsiDivergence==='bearish'?'하락 다이버전스 ⚠️':data.rsiDivergence==='bullish'?'상승 다이버전스 ✓':'없음',weight:1});
  
  // 집계
  var validChecks=checks.filter(function(c){return c.pass!==null});
  var passed=validChecks.filter(function(c){return c.pass===true}).length;
  var total=validChecks.length;
  var ratio=total>0?passed/total:0;
  var verdict;
  if(ratio>=0.75)verdict={text:'매수 검토 가능',color:'#16a34a',bg:'bg-green-50',border:'border-green-400'};
  else if(ratio>=0.5)verdict={text:'주의 후 소량 진입',color:'#eab308',bg:'bg-yellow-50',border:'border-yellow-400'};
  else verdict={text:'매수 보류 권장',color:'#ef4444',bg:'bg-red-50',border:'border-red-400'};
  
  return{checks:checks,passed:passed,total:total,ratio:ratio,verdict:verdict};
}

function getAnalystBoost(symbol){
  if(!symbol)return null;
  var memos=getAnalystMemos();
  var hits=memos.filter(function(m){return m.stocks.indexOf(symbol)!==-1});
  if(!hits.length)return null;
  var names=Array.from(new Set(hits.map(function(h){return h.name})));
  return {count:hits.length,analysts:names,recent:hits[hits.length-1]};
}

function extractStockNames(text){
if(!text||typeof text!=='string')return [];
  var names=Object.keys(KR_CODE||{}).filter(function(n){return n.length>=2});
  names.sort(function(a,b){return b.length-a.length});
  var work=text;
  var found=[];
  names.forEach(function(n){
    if(work.indexOf(n)!==-1){found.push(n);work=work.split(n).join(' '.repeat(n.length))}
  });
  return found.sort();
}

function assessStockRisk(code,fin){
  var warnings=[];
  if(!code)return warnings;
  
  // 1. 수동 등록된 위험 종목 체크
  if(RISKY_STOCKS['관리종목'].indexOf(code)!==-1)warnings.push({level:'critical',type:'관리종목',msg:'⛔ 관리종목 지정. 상장폐지 가능성 있음. 매수 금지 권장.'});
  if(RISKY_STOCKS['투자주의'].indexOf(code)!==-1)warnings.push({level:'high',type:'투자주의',msg:'⚠️ 투자주의/경고/위험 종목. 단기 과열 또는 변동성 큼.'});
  if(RISKY_STOCKS['거래정지'].indexOf(code)!==-1)warnings.push({level:'critical',type:'거래정지',msg:'⛔ 거래정지 상태. 매매 불가능.'});
  if(RISKY_STOCKS['상장폐지'].indexOf(code)!==-1)warnings.push({level:'critical',type:'상장폐지',msg:'⛔ 상장폐지 예정/확정. 절대 매수 금지.'});
  
  // 2. 재무 데이터 기반 자체 판단
  if(fin){
    // 자본잠식 (자본총계 < 0 또는 자본잠식률 50% 이상)
    if(fin.totalEquity!==null&&fin.totalEquity<0){
      warnings.push({level:'critical',type:'자본잠식',msg:'⛔ 완전자본잠식. 자본총계 마이너스. 관리종목 지정 가능성.'});
    }else if(fin.totalEquity!==null&&fin.totalAssets!==null&&fin.totalEquity>0){
      var equityRatio=fin.totalEquity/fin.totalAssets;
      if(equityRatio<0.1)warnings.push({level:'high',type:'자본취약',msg:'⚠️ 자본비율 '+(equityRatio*100).toFixed(1)+'%. 재무구조 매우 취약.'});
    }
    
    // 부채비율 극도 위험 (500% 이상)
    if(fin.debtRatio!==null&&fin.debtRatio>=500){
      warnings.push({level:'high',type:'고부채',msg:'⚠️ 부채비율 '+fin.debtRatio+'%. 매우 위험 수준 (500%+).'});
    }
    
    // 영업이익 적자
    if(fin.opIncome!==null&&fin.opIncome<0){
      warnings.push({level:'medium',type:'영업적자',msg:'⚠️ 영업적자. 본업에서 손실 발생 중.'});
    }
    
    // 매출액 급감 (-30% 이상)
    if(fin.revenueGrowth!==null&&fin.revenueGrowth<=-30){
      warnings.push({level:'high',type:'매출급감',msg:'⚠️ 매출 '+fin.revenueGrowth+'%. 사업 위축 심각.'});
    }
    
    // 당기순손실 + 매출액 30억 미만 (관리종목 지정 요건 근접)
    if(fin.netIncome!==null&&fin.netIncome<0&&fin.revenue!==null&&fin.revenue<3000000000){
      warnings.push({level:'critical',type:'관리종목요건',msg:'⛔ 매출 30억 미만 + 순손실. 관리종목 지정 요건에 근접.'});
    }
  }
  
  return warnings;
}

function fetchDartFinancial3Y(stockCode){
  if(StockAPI.proxyOnline!==true)return Promise.resolve(null);
  var dk=getDartKey();if(!dk)return Promise.resolve(null);
  var cc=DART_CORP[stockCode];if(!cc)return Promise.resolve(null);
  var ck='dart3y_'+stockCode;
  var cached=CacheManager.get(ck,86400000);if(cached)return Promise.resolve(cached);
  var now=new Date(),thisY=now.getFullYear(),m=now.getMonth()+1;
  var baseY=(m>=4)?thisY-1:thisY-2;
  var years=[baseY,baseY-1,baseY-2];
  function fetchYear(y){
    if(StockAPI.dartCount()>=9000)return Promise.resolve(null);
    StockAPI.trackDart();
    var url='https://opendart.fss.or.kr/api/fnlttSinglAcnt.json?crtfc_key='+dk+'&corp_code='+cc+'&bsns_year='+y+'&reprt_code=11011';
    var proxyUrl='https://stock-proxy.kgwsw.workers.dev/proxy?url='+encodeURIComponent(url);
    return fetch(proxyUrl).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(j){
      if(j.status==='000'&&j.list&&j.list.length>0){
        var res=parseDart(j.list,stockCode);
        if(res){res.year=y;return res;}
      }
      return null;
    }).catch(function(){return null});
  }
  return Promise.all(years.map(fetchYear)).then(function(results){
    var valid=results.filter(function(x){return x&&x.revenue});
    if(valid.length===0)return null;
    var out={symbol:stockCode,years:valid,trend:{}};
    if(valid.length>=2){
      var newest=valid[0],oldest=valid[valid.length-1];
      var yrs=valid.length-1;
      if(newest.revenue&&oldest.revenue&&oldest.revenue>0){
        var ratio=newest.revenue/oldest.revenue;
        out.trend.revenueGrowth=Number(((Math.pow(ratio,1/yrs)-1)*100).toFixed(2));
      }
       function calcGr(oldV,newV,n){
        if(oldV==null||newV==null)return null;
        if(oldV<0&&newV>0)return 999;
        if(oldV>0&&newV<0)return -999;
        if(oldV<0&&newV<0)return newV>oldV?-50:-100;
        if(oldV>0&&newV>0)return Number(((Math.pow(newV/oldV,1/n)-1)*100).toFixed(2));
        return null;
      }
      out.trend.opIncomeGrowth=calcGr(oldest.opIncome,newest.opIncome,yrs);
      out.trend.netIncomeGrowth=calcGr(oldest.netIncome,newest.netIncome,yrs);

      if(typeof newest.debtRatio==='number'&&typeof oldest.debtRatio==='number'){
        out.trend.debtRatioChange=Number((newest.debtRatio-oldest.debtRatio).toFixed(2));
      }
    }
    CacheManager.set(ck,out);
    return out;
  });
}

    reports.push({y:thisY-2,r:'11012',q:2,label:(thisY-2)+'Q2'});
    reports.push({y:thisY-2,r:'11014',q:3,label:(thisY-2)+'Q3'});
    reports.push({y:thisY-2,r:'11011',q:4,label:(thisY-2)+'Q4'});
    reports.push({y:thisY-1,r:'11013',q:1,label:(thisY-1)+'Q1'});
    reports.push({y:thisY-1,r:'11012',q:2,label:(thisY-1)+'Q2'});
    reports.push({y:thisY-1,r:'11014',q:3,label:(thisY-1)+'Q3'});
  }
  function fetchOne(rep){
    if(StockAPI.dartCount()>=9000)return Promise.resolve(null);
    StockAPI.trackDart();
    var url='https://opendart.fss.or.kr/api/fnlttSinglAcnt.json?crtfc_key='+dk+'&corp_code='+cc+'&bsns_year='+rep.y+'&reprt_code='+rep.r;
    var proxyUrl='https://stock-proxy.kgwsw.workers.dev/proxy?url='+encodeURIComponent(url);
    return fetch(proxyUrl).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(j){
      if(j.status==='000'&&j.list&&j.list.length>0){
        var res=parseDart(j.list,stockCode);
        if(res){res.year=rep.y;res.quarter=rep.q;res.label=rep.label;res.reportCode=rep.r;return res;}
      }
      return null;
    }).catch(function(){return null});
  }
  return Promise.all(reports.map(fetchOne)).then(function(results){
    var valid=results.filter(function(x){return x&&x.revenue});
    if(valid.length===0)return null;
    var quarters=[];
    for(var i=0;i<valid.length;i++){
      var cur=valid[i];
      var prev=null;
      if(cur.quarter>1){
        for(var j=i-1;j>=0;j--){
          if(valid[j].year===cur.year&&valid[j].quarter===cur.quarter-1){prev=valid[j];break;}
        }
      }
      var q={year:cur.year,quarter:cur.quarter,label:cur.label};
            if(cur.quarter<=3){
        q.revenue=cur.revenue;
        q.opIncome=cur.opIncome;
        q.netIncome=cur.netIncome;
      } else {
        var q1=null,q2=null,q3=null;
        for(var pj=0;pj<valid.length;pj++){
          if(valid[pj].year===cur.year){
            if(valid[pj].quarter===1)q1=valid[pj];
            if(valid[pj].quarter===2)q2=valid[pj];
            if(valid[pj].quarter===3)q3=valid[pj];
          }
        }
        if(q1&&q2&&q3){
          q.revenue=(cur.revenue!=null)?cur.revenue-(q1.revenue||0)-(q2.revenue||0)-(q3.revenue||0):null;
          q.opIncome=(cur.opIncome!=null)?cur.opIncome-(q1.opIncome||0)-(q2.opIncome||0)-(q3.opIncome||0):null;
          q.netIncome=(cur.netIncome!=null)?cur.netIncome-(q1.netIncome||0)-(q2.netIncome||0)-(q3.netIncome||0):null;
        } else {
          q.revenue=null;q.opIncome=null;q.netIncome=null;
        }
      }

      q.totalAssets=cur.totalAssets;
      q.totalLiab=cur.totalLiab;
      q.debtRatio=cur.debtRatio;
      quarters.push(q);
    }
    var recent4=quarters.slice(-4);
    var out={symbol:stockCode,quarters:recent4,allQuarters:quarters,yoy:{}};
    if(quarters.length>=5){
      var newest=quarters[quarters.length-1];
      var yearAgo=null;
      for(var k=quarters.length-2;k>=0;k--){
        if(quarters[k].year===newest.year-1&&quarters[k].quarter===newest.quarter){yearAgo=quarters[k];break;}
      }
      if(yearAgo){
        function yoyCalc(oldV,newV){
          if(oldV==null||newV==null)return null;
          if(oldV<0&&newV>0)return 999;
          if(oldV>0&&newV<0)return -999;
          if(oldV<0&&newV<0)return newV>oldV?-50:-100;
          if(oldV>0&&newV>0)return Number(((newV/oldV-1)*100).toFixed(2));
          return null;
        }
        out.yoy.revenueYoY=yoyCalc(yearAgo.revenue,newest.revenue);
        out.yoy.opIncomeYoY=yoyCalc(yearAgo.opIncome,newest.opIncome);
        out.yoy.netIncomeYoY=yoyCalc(yearAgo.netIncome,newest.netIncome);
        out.yoy.baseLabel=yearAgo.label;
        out.yoy.compareLabel=newest.label;
      }
    }
    if(quarters.length>=4){
      var last4=quarters.slice(-4);
      var sumR=0,sumO=0,sumN=0,validR=true,validO=true,validN=true;
      for(var l=0;l<last4.length;l++){
        if(last4[l].revenue==null)validR=false;else sumR+=last4[l].revenue;
        if(last4[l].opIncome==null)validO=false;else sumO+=last4[l].opIncome;
        if(last4[l].netIncome==null)validN=false;else sumN+=last4[l].netIncome;
      }
      out.ttm={
        revenue:validR?sumR:null,
        opIncome:validO?sumO:null,
        netIncome:validN?sumN:null,
        period:last4[0].label+'~'+last4[last4.length-1].label
      };
    }
    CacheManager.set(ck,out);
    return out;
  });
}

function formatDataAgeLabel(dateStr){
  if(!dateStr) return '기준일 미표시';
  try{
    var now=new Date();
    var dt=new Date(dateStr);
    var diff=Math.floor((now-dt)/86400000);
    if(isNaN(diff)) return dateStr;
    if(diff<=1) return dateStr+' · 최신';
    if(diff<=7) return dateStr+' · '+diff+'일 전';
    return dateStr+' · '+diff+'일 전';
  }catch(e){return dateStr}
}

function parseDart(list,sc){
  var cfs=list.filter(function(x){return x.fs_div==='CFS'});
  var items=cfs.length>0?cfs:list.filter(function(x){return x.fs_div==='OFS'});
  if(!items.length)items=list;
  function fv(kws,sj,field){
    field=field||'thstrm_amount';
    for(var k=0;k<kws.length;k++){
      var f=items.filter(function(x){var nm=(x.account_nm||'').replace(/\s/g,'');return nm.indexOf(kws[k])!==-1&&(!sj||x.sj_div===sj)});
      if(f.length>0){var a=f[0][field]||f[0][field.replace('thstrm','thstrm_add')];if(a)return Number(String(a).replace(/,/g,''))}}
    return null}
  var rev=fv(['매출액','수익(매출액)','영업수익'],'IS'),opI=fv(['영업이익','영업손익'],'IS'),
    nI=fv(['당기순이익','당기순손익','분기순이익'],'IS'),
    tA=fv(['자산총계'],'BS'),tL=fv(['부채총계'],'BS'),tE=fv(['자본총계'],'BS');
  if(!tE&&!tA)return null;
  var pRev=fv(['매출액','수익(매출액)','영업수익'],'IS','frmtrm_amount');
  var pOp=fv(['영업이익','영업손익'],'IS','frmtrm_amount');
  return{revenue:rev,opIncome:opI,netIncome:nI,totalAssets:tA,totalLiab:tL,totalEquity:tE,
    debtRatio:tE&&tL?+(tL/tE*100).toFixed(1):null,roe:tE&&nI?+(nI/tE*100).toFixed(1):null,
    opMargin:rev&&opI?+(opI/rev*100).toFixed(1):null,netMargin:rev&&nI?+(nI/rev*100).toFixed(1):null,
    revenueGrowth:rev&&pRev&&pRev!==0?+((rev-pRev)/Math.abs(pRev)*100).toFixed(1):null,
    opIncomeGrowth:opI&&pOp&&pOp!==0?+((opI-pOp)/Math.abs(pOp)*100).toFixed(1):null,
   per:null,pbr:null,stockCode:sc,source:'dart',shares:null}
}

/* ============================================
   v5: 기술적 지표 (개선)
   ============================================ */
// RSI + history (다이버전스 탐지용)
function calcRSI(c,p){
  p=p||14;if(c.length<p+1)return null;
  var gains=[],losses=[];
  for(var i=1;i<c.length;i++){var d=c[i]-c[i-1];gains.push(d>0?d:0);losses.push(d<0?Math.abs(d):0)}
  var ag=0,al=0;for(var j=0;j<p;j++){ag+=gains[j];al+=losses[j]}ag/=p;al/=p;
  var hist=[al===0?100:+(100-100/(1+ag/al)).toFixed(1)];
  for(var k=p;k<gains.length;k++){ag=(ag*(p-1)+gains[k])/p;al=(al*(p-1)+losses[k])/p;
    hist.push(al===0?100:+(100-100/(1+ag/al)).toFixed(1))}
  return{current:hist[hist.length-1],history:hist}
}

// Stochastic RSI
function calcStochRSI(hist,p){
  p=p||14;if(!hist||hist.length<p)return null;
  var sl=hist.slice(-p),mn=Math.min.apply(null,sl),mx=Math.max.apply(null,sl),rng=mx-mn;
  return rng===0?50:+((hist[hist.length-1]-mn)/rng*100).toFixed(1)
}

// RSI Divergence
function detectRSIDivergence(closes,rsiHist,lookback){
  lookback=lookback||30;if(!rsiHist||rsiHist.length<lookback||closes.length<lookback)return null;
  var ps=closes.slice(-lookback),rs=rsiHist.slice(-lookback),h=Math.floor(lookback/2);
  var pMax1=-Infinity,pMax2=-Infinity,rMax1=0,rMax2=0;
  for(var i=h;i<lookback;i++){if(ps[i]>pMax1){pMax1=ps[i];rMax1=rs[i]}}
  for(var j=0;j<h;j++){if(ps[j]>pMax2){pMax2=ps[j];rMax2=rs[j]}}
  if(pMax1>pMax2&&rMax1<rMax2-3)return'bearish';
  var pMin1=Infinity,pMin2=Infinity,rMin1=0,rMin2=0;
  for(var k=h;k<lookback;k++){if(ps[k]<pMin1){pMin1=ps[k];rMin1=rs[k]}}
  for(var m=0;m<h;m++){if(ps[m]<pMin2){pMin2=ps[m];rMin2=rs[m]}}
  if(pMin1<pMin2&&rMin1>rMin2+3)return'bullish';
  return null
}

// ADX
function calcADX(highs,lows,closes,p){
  p=p||14;if(closes.length<p*2+1)return null;
  var tr=[],pDM=[],nDM=[];
  for(var i=1;i<closes.length;i++){
    var hd=highs[i]-highs[i-1],ld=lows[i-1]-lows[i];
    pDM.push(hd>ld&&hd>0?hd:0);nDM.push(ld>hd&&ld>0?ld:0);
    tr.push(Math.max(highs[i]-lows[i],Math.abs(highs[i]-closes[i-1]),Math.abs(lows[i]-closes[i-1])))
  }
  function sm(a,n){var s=[0];for(var j=0;j<n;j++)s[0]+=a[j];for(var k=n;k<a.length;k++)s.push(s[s.length-1]-s[s.length-1]/n+a[k]);return s}
  var sTR=sm(tr,p),sPD=sm(pDM,p),sND=sm(nDM,p),dx=[];
  for(var m=0;m<sTR.length;m++){if(sTR[m]===0)continue;
    var pi=sPD[m]/sTR[m]*100,ni=sND[m]/sTR[m]*100,s2=pi+ni;
    if(s2>0)dx.push(Math.abs(pi-ni)/s2*100)}
  if(dx.length<p)return null;
  var adxS=0;for(var n=dx.length-p;n<dx.length;n++)adxS+=dx[n];
  return+(adxS/p).toFixed(1)
}

// MACD (v5: 인덱스 수정)
function calcMACD(c){
  if(c.length<35)return null;
  function ema(d,p){var k=2/(p+1),e=[d[0]];for(var i=1;i<d.length;i++)e.push(d[i]*k+e[i-1]*(1-k));return e}
  var e12=ema(c,12),e26=ema(c,26);
  var ml=[];for(var i=0;i<c.length;i++)ml.push(+(e12[i]-e26[i]).toFixed(4));
  var macdReady=ml.slice(25);if(macdReady.length<9)return null;
  var sl=ema(macdReady,9);
  var mi=macdReady.length-1,si=sl.length-1;
  var m=macdReady[mi],s=sl[si],pm=macdReady[mi-1],ps=sl[si-1];
  return{macd:+m.toFixed(2),signal:+s.toFixed(2),histogram:+(m-s).toFixed(2),
    crossover:pm<=ps&&m>s,crossunder:pm>=ps&&m<s,aboveZero:m>0}
}

function calcVolRatio(v,p){p=p||20;if(v.length<p+1)return null;var r=v[v.length-1],s=0;for(var i=v.length-p-1;i<v.length-1;i++)s+=v[i];var avg=s/p;return avg>0?+(r/avg*100).toFixed(0):0}
function calcMA(c,p){if(c.length<p)return null;var s=0;for(var i=c.length-p;i<c.length;i++)s+=c[i];return+(s/p).toFixed(2)}

// BB (v5: percentB 추가)
function calcBB(c,p){
  p=p||20;if(c.length<p)return null;
  var sl=c.slice(-p),avg=sl.reduce(function(a,b){return a+b},0)/p;
  var v=sl.reduce(function(a,b){return a+Math.pow(b-avg,2)},0)/p,std=Math.sqrt(v);
  var w=avg>0?+((4*std)/avg*100).toFixed(1):0;
  var pB=std>0?+((c[c.length-1]-(avg-2*std))/(4*std)*100).toFixed(1):50;
  return{upper:+(avg+2*std).toFixed(2),middle:+avg.toFixed(2),lower:+(avg-2*std).toFixed(2),width:w,percentB:pB,std:+std.toFixed(2)}
}

// OBV
function calcOBV(closes,volumes){
  if(!closes||closes.length<20)return null;
  var obv=[0];for(var i=1;i<closes.length;i++){
    if(closes[i]>closes[i-1])obv.push(obv[obv.length-1]+volumes[i]);
    else if(closes[i]<closes[i-1])obv.push(obv[obv.length-1]-volumes[i]);
    else obv.push(obv[obv.length-1])}
  var oR=obv.slice(-5).reduce(function(a,b){return a+b},0)/5;
  var oP=obv.slice(-20,-15).reduce(function(a,b){return a+b},0)/5;
  var pUp=closes[closes.length-1]>closes[closes.length-20],oUp=oR>oP;
  if(pUp&&oUp)return{trend:'confirmed_up'};if(!pUp&&!oUp)return{trend:'confirmed_down'};
  if(pUp&&!oUp)return{trend:'div_bearish'};if(!pUp&&oUp)return{trend:'div_bullish'};
  return{trend:'neutral'}
}

// Fibonacci
function calcATR(highs,lows,closes,period){
  period=period||14;if(!closes||closes.length<period+1)return null;
  var trs=[];for(var i=1;i<closes.length;i++){
    var h=highs[i],l=lows[i],pc=closes[i-1];
    trs.push(Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc)))}
  var atr=0;for(var j=trs.length-period;j<trs.length;j++)atr+=trs[j];atr/=period;
  var cur=closes[closes.length-1];
  return{atr:+atr.toFixed(2),atrPct:+(atr/cur*100).toFixed(2),stopLoss:+(cur-atr*2).toFixed(0),target:+(cur+atr*3).toFixed(0),riskReward:'1:1.5'}
}
function calcFib(closes,lb){
  lb=lb||120;if(!closes||closes.length<20)return null;
  if(closes.length<lb)lb=closes.length;
  var sl=closes.slice(-lb),hi=Math.max.apply(null,sl),lo=Math.min.apply(null,sl),d=hi-lo;
  if(d===0)return null;var cur=closes[closes.length-1];
  var levels=[{r:0,p:hi},{r:0.236,p:+(hi-d*0.236).toFixed(2)},{r:0.382,p:+(hi-d*0.382).toFixed(2)},
    {r:0.5,p:+(hi-d*0.5).toFixed(2)},{r:0.618,p:+(hi-d*0.618).toFixed(2)},{r:0.786,p:+(hi-d*0.786).toFixed(2)},{r:1,p:lo}];
  var sup=null,res=null;
  for(var i=0;i<levels.length;i++){if(levels[i].p<=cur&&(!sup||levels[i].p>sup.p))sup=levels[i];if(levels[i].p>=cur&&(!res||levels[i].p<res.p))res=levels[i]}
  return{levels:levels,support:sup,resistance:res,current:cur}
}

/* ============================================
   v5: 재무 점수 (섹터별 기준)
   ============================================ */
function calcFinScore(fin,sector){
  if(!fin)return{score:50,signals:[],available:false};
  var sc=50,sigs=[],isFin=FINANCIAL_SECTORS.indexOf(sector)!==-1;

  if(fin.roe!==null){
    if(fin.roe>=15){sc+=15;sigs.push({type:'buy',text:'ROE '+fin.roe+'%'})}
    else if(fin.roe>=10){sc+=8;sigs.push({type:'info',text:'ROE '+fin.roe+'%'})}
    else if(fin.roe>=5)sc+=2;
    else if(fin.roe>=0){sc-=5;sigs.push({type:'info',text:'ROE '+fin.roe+'% 저조'})}
    else{sc-=15;sigs.push({type:'warn',text:'ROE '+fin.roe+'% 적자'})}}

  if(fin.debtRatio!==null){
    if(isFin){if(fin.debtRatio<=1500)sc+=5;else if(fin.debtRatio>2500){sc-=5;sigs.push({type:'warn',text:'부채 '+fin.debtRatio+'%(금융업 높음)'})}}
    else{if(fin.debtRatio<=50){sc+=10;sigs.push({type:'buy',text:'부채 '+fin.debtRatio+'%'})}
      else if(fin.debtRatio<=100)sc+=5;
      else if(fin.debtRatio<=200){sc-=5;sigs.push({type:'info',text:'부채 '+fin.debtRatio+'%'})}
      else{sc-=15;sigs.push({type:'warn',text:'부채 '+fin.debtRatio+'% 위험'})}}}

  if(fin.opMargin!==null){
    if(fin.opMargin>=20){sc+=10;sigs.push({type:'buy',text:'영업이익률 '+fin.opMargin+'%'})}
    else if(fin.opMargin>=10)sc+=5;
    else if(fin.opMargin<0){sc-=10;sigs.push({type:'sell',text:'영업적자 '+fin.opMargin+'%'})}}

  if(fin.revenueGrowth!==null){
    if(fin.revenueGrowth>=20){sc+=8;sigs.push({type:'buy',text:'매출+'+fin.revenueGrowth+'%'})}
    else if(fin.revenueGrowth>=5)sc+=4;
    else if(fin.revenueGrowth<0){sc-=8;sigs.push({type:'warn',text:'매출'+fin.revenueGrowth+'%'})}}

  var eg=fin.opIncomeGrowth||fin.earningsGrowth;
  if(eg!==null){if(eg>=30)sc+=7;else if(eg>=10)sc+=3;else if(eg<-20){sc-=7;sigs.push({type:'warn',text:'이익'+eg+'%'})}}

  if(fin.per!==null&&fin.per>0){
    if(fin.per<=10){sc+=5;sigs.push({type:'buy',text:'PER '+fin.per})}
    else if(fin.per<=20)sc+=2;
    else if(fin.per>=50){sc-=5;sigs.push({type:'warn',text:'PER '+fin.per+' 고평가'})}}

  if(fin.pbr!==null&&fin.pbr>0){
    if(fin.pbr<=1){sc+=3;sigs.push({type:'buy',text:'PBR '+fin.pbr})}
    else if(fin.pbr>=5){sc-=3;sigs.push({type:'warn',text:'PBR '+fin.pbr})}}

  return{score:Math.max(0,Math.min(100,sc)),signals:sigs,available:true}
}

/* ============================================
   v5: 종합 분석 함수
   ============================================ */
function analyzeStock(daily,monthly,sym,finData,sector){
  if(!daily||daily.length<30)return null;
  var closes=daily.map(function(d){return d.close}),highs=daily.map(function(d){return d.high}),
    lows=daily.map(function(d){return d.low}),vols=daily.map(function(d){return d.volume});
  var last=daily[daily.length-1],prev=daily[daily.length-2];

  var rsiObj=calcRSI(closes,14),rsi14=rsiObj?rsiObj.current:null;
  var stochRSI=rsiObj?calcStochRSI(rsiObj.history,14):null;
  var rsiDiv=rsiObj?detectRSIDivergence(closes,rsiObj.history,40):null;
  var adx=calcADX(highs,lows,closes,14);
  var macd=calcMACD(closes),volR=calcVolRatio(vols,20),bb=calcBB(closes,20);
  var obv=calcOBV(closes,vols),fib=calcFib(closes,120);
  var atrData=calcATR(highs,lows,closes,14);
  var ma5=calcMA(closes,5),ma20=calcMA(closes,20),ma60=calcMA(closes,60),ma120=closes.length>=120?calcMA(closes,120):null;

  var ma12M=null,ma12Sig=null,ma12Dist=0;
  if(monthly&&monthly.length>=12){
    var mc=monthly.map(function(d){return d.close});
    var s12=0;for(var i=mc.length-12;i<mc.length;i++)s12+=mc[i];ma12M=+(s12/12).toFixed(2);
    var lm=monthly[monthly.length-1],pm2=monthly.length>=2?monthly[monthly.length-2]:null,pma=null;
    if(mc.length>=13){var ps=0;for(var j=mc.length-13;j<mc.length-1;j++)ps+=mc[j];pma=+(ps/12).toFixed(2)}
    var aN=lm.close>=ma12M,aP=pm2&&pma?pm2.close>=pma:null;
    if(aP===false&&aN)ma12Sig='골든크로스';else if(aP===true&&!aN)ma12Sig='데드크로스';
    else if(aN)ma12Sig='12MA위';else ma12Sig='12MA아래';
    ma12Dist=ma12M>0?+((lm.close-ma12M)/ma12M*100).toFixed(1):0
  }

  var chg=prev?+((last.close-prev.close)/prev.close*100).toFixed(2):0;
  var amtB=Math.round(last.close*last.volume/1e8);
  var scores={trend:0,momentum:0,volume:0,financial:50,total:0},sigs=[];

  // ■ 추세 점수 (v5: 12MA 거리 비율 연속)
  var ts=50;
  if(ma12M&&ma12M>0){ts=50+Math.max(-30,Math.min(30,ma12Dist*2));
    if(ma12Sig==='골든크로스')ts=Math.min(100,ts+15);
    else if(ma12Sig==='데드크로스')ts=Math.max(0,ts-15)}
  if(last.close>ma5&&ma5>ma20&&ma20>(ma60||0))ts=Math.min(100,ts+10);
  if(last.close<ma5&&ma5<ma20)ts=Math.max(0,ts-10);
  if(adx!==null){if(adx>=25&&ts>60)ts=Math.min(100,ts+5);if(adx>=25&&ts<40)ts=Math.max(0,ts-5)}
  scores.trend=Math.max(0,Math.min(100,Math.round(ts)));

  // ■ 모멘텀 (v5: StochRSI + Divergence + MACD fix)
  var ms=50;
  if(rsi14!==null){
    if(rsi14>=70){ms=25;sigs.push({type:'warn',text:'RSI '+rsi14+' 과매수'})}
    else if(rsi14>=60)ms=65;else if(rsi14>=40)ms=70;
    else if(rsi14>=30){ms=55;sigs.push({type:'info',text:'RSI '+rsi14+' 과매도근접'})}
    else{ms=40;sigs.push({type:'info',text:'RSI '+rsi14+' 과매도'})}}
  if(stochRSI!==null){if(stochRSI>=80)ms=Math.max(0,ms-5);else if(stochRSI<=20)ms=Math.min(100,ms+5)}
  if(rsiDiv==='bearish'){ms=Math.max(0,ms-15);sigs.push({type:'sell',text:'RSI 하락다이버전스⚡'})}
  else if(rsiDiv==='bullish'){ms=Math.min(100,ms+15);sigs.push({type:'buy',text:'RSI 상승다이버전스⚡'})}
  if(macd){
    if(macd.crossover){ms=Math.min(100,ms+15);sigs.push({type:'buy',text:'MACD 골든크로스'+(macd.aboveZero?' (0↑)':'')})}
    else if(macd.crossunder){ms=Math.max(0,ms-15);sigs.push({type:'sell',text:'MACD 데드크로스'})}
    if(macd.histogram>0)ms=Math.min(100,ms+3)}
  scores.momentum=Math.max(0,Math.min(100,Math.round(ms)));

  // ■ 거래량 (v5: OBV 반영)
  var vs=50;
  if(volR!==null){
    if(volR>=300){vs=chg>0?90:20;sigs.push({type:chg>0?'buy':'warn',text:chg>0?'거래량폭발 '+volR+'%':'하락+거래폭발 '+volR+'%'})}
    else if(volR>=150){vs=chg>0?75:35;if(chg>0)sigs.push({type:'info',text:'거래량↑ '+volR+'%'})}
    else if(volR>=80)vs=55;
    else{vs=35;sigs.push({type:'info',text:'거래량부족 '+volR+'%'})}}
  if(obv){if(obv.trend==='div_bearish'){vs=Math.max(0,vs-10);sigs.push({type:'warn',text:'OBV 하락다이버전스'})}
    else if(obv.trend==='div_bullish'){vs=Math.min(100,vs+10);sigs.push({type:'buy',text:'OBV 상승다이버전스'})}}
  scores.volume=Math.max(0,Math.min(100,Math.round(vs)));

  // 12MA / BB / ADX 신호
  if(ma12Sig==='골든크로스')sigs.unshift({type:'buy',text:'12MA 골든크로스'});
  else if(ma12Sig==='데드크로스')sigs.unshift({type:'sell',text:'12MA 데드크로스'});
  else if(ma12Sig==='12MA위')sigs.push({type:'info',text:'12MA위 +'+ma12Dist+'%'});
  else if(ma12Sig==='12MA아래')sigs.push({type:'warn',text:'12MA아래 '+ma12Dist+'%'});
  if(bb){if(bb.percentB>=100)sigs.push({type:'warn',text:'BB상단돌파'});
    else if(bb.percentB<=0)sigs.push({type:'info',text:'BB하단근접'});
    if(bb.width<8)sigs.push({type:'info',text:'BB수축 W'+bb.width})}
  if(adx!==null){if(adx>=25)sigs.push({type:'info',text:'ADX '+adx+' 강추세'});
    else if(adx<15)sigs.push({type:'info',text:'ADX '+adx+' 추세약'})}

  // ■ 재무 점수
  if(finData&&sym){var codeForPer=getCode(sym)||'';if(codeForPer)calcPERPBR(finData,codeForPer,last.close);}
  var finScore=calcFinScore(finData,sector);
  scores.financial=finScore.score;sigs=sigs.concat(finScore.signals);
  var hasFin=finScore.available;
  var wt={trend:0.35,momentum:0.25,volume:0.20,financial:0.20};
  var noFinWt={trend:0.40,momentum:0.30,volume:0.30};
  if(sector){
    if(['바이오','의료기기'].indexOf(sector)!==-1){wt={trend:0.25,momentum:0.35,volume:0.25,financial:0.15};noFinWt={trend:0.30,momentum:0.40,volume:0.30}}
    else if(['금융'].indexOf(sector)!==-1){wt={trend:0.25,momentum:0.15,volume:0.15,financial:0.45};noFinWt={trend:0.35,momentum:0.30,volume:0.35}}

/* ============================================================
   ⭐ 정직한 백테스트 v2 - 룩어헤드 편향 제거
   - 신호: 당일 종가 기준 발생
   - 체결: 다음날 시초가 (실전과 동일)
   - 거래세: 0.23% (정확)
   ============================================================ */
function honestBacktestV2(md,strategyFn,opts){
  opts=opts||{};
  var fee=opts.fee||0.00015;
  var tax=opts.tax||0.0023;
  var slip=opts.slip||0.003;
  if(!md||md.length<60)return null;
  
  var sorted=md.slice().sort(function(a,b){
    var da=a.date||a.time;var db=b.date||b.time;
    return da<db?-1:1;
  });
  
  var capital=10000000;
  var initCap=capital;
  var shares=0;
  var buyPrice=0;
  var trades=[];
  var equityCurve=[];
  var bhCurve=[];
  var startPrice=sorted[20].close;
  var peak=initCap,maxDD=0;
  var monthlyReturns=[];
  var lastMonthCap=initCap;
  
  for(var i=20;i<sorted.length-1;i++){
    var today=sorted[i];
    var nextDay=sorted[i+1];
    var closes=sorted.slice(0,i+1).map(function(x){return x.close});
    var highs=sorted.slice(0,i+1).map(function(x){return x.high});
    var lows=sorted.slice(0,i+1).map(function(x){return x.low});
    
    var signal=strategyFn(closes,highs,lows,sorted.slice(0,i+1),i);
    
    if(signal==='buy'&&shares===0){
      var execPrice=nextDay.open*(1+slip);
      var cost=execPrice*(1+fee);
      shares=Math.floor(capital*0.95/cost);
      if(shares>0){
        buyPrice=execPrice;
        capital-=shares*cost;
        trades.push({type:'buy',signalDate:today.date||today.time,execDate:nextDay.date||nextDay.time,signalPrice:today.close,execPrice:Math.round(execPrice),shares:shares});
      }
    }else if(signal==='sell'&&shares>0){
      var sellExecPrice=nextDay.open*(1-slip);
      var revenue=shares*sellExecPrice*(1-fee-tax);
      var pnl=revenue-(shares*buyPrice*(1+fee));
      var pnlPct=+(pnl/(shares*buyPrice)*100).toFixed(2);
      capital+=revenue;
      trades.push({type:'sell',signalDate:today.date||today.time,execDate:nextDay.date||nextDay.time,signalPrice:today.close,execPrice:Math.round(sellExecPrice),shares:shares,pnl:Math.round(pnl),pnlPct:pnlPct});
      shares=0;buyPrice=0;
    }
    
    var totalValue=capital+shares*today.close;
    equityCurve.push({date:today.date||today.time,value:totalValue});
    bhCurve.push({date:today.date||today.time,value:initCap*(today.close/startPrice)});
    
    if(totalValue>peak)peak=totalValue;
    var dd=(peak-totalValue)/peak;
    if(dd>maxDD)maxDD=dd;
    
    var dateStr=String(today.date||today.time).substring(0,7);
    var nextDateStr=String(nextDay.date||nextDay.time).substring(0,7);
    if(dateStr!==nextDateStr){
      monthlyReturns.push((totalValue-lastMonthCap)/lastMonthCap);
      lastMonthCap=totalValue;
    }
  }
  
  if(shares>0){
    var lastDay=sorted[sorted.length-1];
    var finalPrice=lastDay.close*(1-slip);
    var finalRevenue=shares*finalPrice*(1-fee-tax);
    capital+=finalRevenue;
    var finalPnl=finalRevenue-(shares*buyPrice*(1+fee));
    trades.push({type:'sell',signalDate:lastDay.date||lastDay.time,execDate:lastDay.date||lastDay.time,signalPrice:lastDay.close,execPrice:Math.round(finalPrice),shares:shares,pnl:Math.round(finalPnl),pnlPct:+(finalPnl/(shares*buyPrice)*100).toFixed(2),forced:true});
  }
  
   var totalReturn=+((capital-initCap)/initCap*100).toFixed(2);
  var bhReturn=+(((sorted[sorted.length-1].close/startPrice)-1)*100).toFixed(2);
  var alpha=+(totalReturn-bhReturn).toFixed(2);
  var sellTrades=trades.filter(function(t){return t.type==='sell'});
  var wins=sellTrades.filter(function(t){return t.pnl>0}).length;
  var losses=sellTrades.filter(function(t){return t.pnl<=0}).length;
  var winRate=sellTrades.length>0?+(wins/sellTrades.length*100).toFixed(1):0;
  
  var sharpe=null;
  if(monthlyReturns.length>3){
    var avgR=monthlyReturns.reduce(function(a,b){return a+b},0)/monthlyReturns.length;
    var stdR=Math.sqrt(monthlyReturns.reduce(function(a,b){return a+Math.pow(b-avgR,2)},0)/monthlyReturns.length);
    if(stdR>0)sharpe=+((avgR*12-0.035)/(stdR*Math.sqrt(12))).toFixed(2);
  }
  
   return {
    valid:true,
    totalReturn:totalReturn,
    buyAndHold:bhReturn,
    alpha:alpha,
    sharpe:sharpe,
    maxDrawdown:+(maxDD*100).toFixed(2),
    winRate:winRate,
    wins:wins,
    losses:losses,
    totalTrades:sellTrades.length,
    finalCapital:Math.round(capital),
    trades:trades,
    tradeCount:sellTrades.length,
    equityCurve:equityCurve,
    bhCurve:bhCurve,
    config:{fee:fee,tax:tax,slip:slip,executionMethod:'다음날 시초가'},
    isHonest:true
  };
}

var HONEST_STRATEGIES={
  'RSI(30/70)':function(closes){
    if(closes.length<15)return null;
    var gains=[],losses=[];
    for(var i=1;i<closes.length;i++){var d=closes[i]-closes[i-1];gains.push(d>0?d:0);losses.push(d<0?Math.abs(d):0)}
    var p=14,ag=0,al=0;
    for(var j=gains.length-p;j<gains.length;j++){ag+=gains[j];al+=losses[j]}
    ag/=p;al/=p;
    var rsi=al===0?100:100-100/(1+ag/al);
    if(rsi<=30)return 'buy';
    if(rsi>=70)return 'sell';
    return null;
  },
  'MACD':function(closes){
    if(closes.length<35)return null;
    function ema(d,p){var k=2/(p+1),e=[d[0]];for(var i=1;i<d.length;i++)e.push(d[i]*k+e[i-1]*(1-k));return e}
    var e12=ema(closes,12),e26=ema(closes,26);
    var macdLine=[];for(var i=0;i<closes.length;i++)macdLine.push(e12[i]-e26[i]);
    var sigLine=ema(macdLine.slice(25),9);
    var idx=macdLine.length-1,sIdx=sigLine.length-1;
    if(macdLine[idx-1]<=sigLine[sIdx-1]&&macdLine[idx]>sigLine[sIdx])return 'buy';
    if(macdLine[idx-1]>=sigLine[sIdx-1]&&macdLine[idx]<sigLine[sIdx])return 'sell';
    return null;
  },
  '12MA':function(closes){
    if(closes.length<13)return null;
    var s=0;for(var i=closes.length-12;i<closes.length;i++)s+=closes[i];
    var ma=s/12;
    var ps=0;for(var j=closes.length-13;j<closes.length-1;j++)ps+=closes[j];
    var pma=ps/12;
    var aN=closes[closes.length-1]>=ma;
    var aP=closes[closes.length-2]>=pma;
    if(!aP&&aN)return 'buy';
    if(aP&&!aN)return 'sell';
    return null;
  }
};

function backtestRSI(md,opts){
  if(typeof honestBacktestV2==='function'){var honestResult=honestBacktestV2(md,HONEST_STRATEGIES['RSI(30/70)'],opts);if(honestResult)return Object.assign({name:'RSI(30/70)'},honestResult);}
  opts=opts||{};var fee=opts.fee||0.0015,slip=opts.slip||0.003;
  if(!md||md.length<20)return null;
  var c=md.map(d=>d.close),trades=[],hold=false,bp=0,tr=1,w=0,l=0,mdd=0,pk=1;
  for(var i=14;i<c.length;i++){
    var gains=0,losses=0;
    for(var j=i-13;j<=i;j++){var ch=c[j]-c[j-1];if(ch>0)gains+=ch;else losses-=ch}
    var rs=losses===0?100:gains/losses;var rsi=100-100/(1+rs);
    if(!hold&&rsi<=30){hold=true;bp=c[i]*(1+slip);tr*=(1-fee);trades.push({type:'buy',price:c[i],date:md[i].date||md[i].time})}
    else if(hold&&rsi>=70){hold=false;var sp=c[i]*(1-slip);var ret=sp/bp;tr*=ret*(1-fee);if(ret>=1)w++;else l++;trades.push({type:'sell',price:c[i],date:md[i].date||md[i].time,return:+((ret-1)*100).toFixed(1)})}
    var cv=hold?tr*(c[i]/bp):tr;if(cv>pk)pk=cv;var dd=(pk-cv)/pk*100;if(dd>mdd)mdd=dd;
  }
  if(hold){var fr=c[c.length-1]*(1-slip)/bp;tr*=fr*(1-fee);if(fr>=1)w++;else l++}
  var bhS=c[14],bhE=c[c.length-1],buyAndHold=+((bhE/bhS-1)*100).toFixed(1);
  var alpha=+((tr-1)*100-buyAndHold).toFixed(1);
  return{name:'RSI(30/70)',totalReturn:+((tr-1)*100).toFixed(1),buyAndHold:buyAndHold,alpha:alpha,maxDrawdown:+mdd.toFixed(1),winRate:w+l>0?Math.round(w/(w+l)*100):0,trades:trades,sharpe:null}
}

    var golden=pma5<=pma20&&ma5>ma20;
    var dead=pma5>=pma20&&ma5<ma20;
    if(shares===0){
      var buySignal=false;
      if(golden&&rsi&&rsi<70)buySignal=true;
      if(rsi&&rsi<=35&&price>ma20&&volRatio>=1.2)buySignal=true;
      if(price>ma5&&ma5>ma20&&volRatio>=1.5&&rsi&&rsi>=40&&rsi<=65)buySignal=true;
      if(buySignal){
        var cost=price*(1+fee+slip);
        shares=Math.floor(cash/cost);
        if(shares>0){buyPrice=price;cash-=shares*cost;trades.push({type:'buy',price:price,date:daily[i].date})}
      }
    }
    if(shares>0){
      var sellSignal=false;
      if(dead)sellSignal=true;
      if(rsi&&rsi>=78)sellSignal=true;
      if(atr>0&&price<buyPrice-atr*2)sellSignal=true;
      if(price<buyPrice*0.92)sellSignal=true;
      if(price>buyPrice*1.15&&rsi&&rsi>=70)sellSignal=true;
      if(sellSignal){
        var revenue=shares*price*(1-fee-slip);
        cash+=revenue;
        var profit=(price-buyPrice)/buyPrice;
        if(profit>0) wins++; else losses++;
        trades.push({type:'sell',price:price,date:daily[i].date,profit:profit});
        shares=0;
      }
    }
    var total=cash+shares*price;
    if(total>peak) peak=total;
    var dd=(peak-total)/peak;
    if(dd>maxDD) maxDD=dd;
    curve.push({date:daily[i].date,value:total});
    bhCurve.push({date:daily[i].date,value:10000000*(price/startPrice)});
  }
  var finalVal=cash+shares*(daily[daily.length-1]?daily[daily.length-1].close:0);
  var bhVal=10000000*(daily[daily.length-1].close/startPrice);
  var totalReturn=((finalVal-10000000)/10000000*100);
  var buyAndHold=((bhVal-10000000)/10000000*100);
  return{name:'일봉종합',totalReturn:Math.round(totalReturn*10)/10,buyAndHold:Math.round(buyAndHold*10)/10,alpha:Math.round((totalReturn-buyAndHold)*10)/10,maxDrawdown:Math.round(maxDD*1000)/10,winRate:wins+losses>0?Math.round(wins/(wins+losses)*100):0,trades:trades,curve:curve,bhCurve:bhCurve,tradeCount:trades.length};
}

function backtestMA12(md,opts){
  if(typeof honestBacktestV2==='function'){var honestResult=honestBacktestV2(md,HONEST_STRATEGIES['12MA'],opts);if(honestResult)return Object.assign({holding:false},honestResult);}
  opts=opts||{};var fee=opts.fee||0.0015,slip=opts.slip||0.003;
  if(!md||md.length<15)return null;
  var c=md.map(function(d){return d.close});
  var trades=[],hold=false,bp=0,tr=1,w=0,l=0,mdd=0,pk=1,mRets=[];

  for(var i=12;i<c.length;i++){
    var s=0;for(var j=i-12;j<i;j++)s+=c[j];var ma=s/12;
    var ps2=0;for(var k=i-13;k<i-1;k++)ps2+=c[k];var pma=ps2/12;
    var aN=c[i]>=ma,aP=c[i-1]>=pma;
    if(!hold&&!aP&&aN){hold=true;bp=c[i]*(1+slip);tr*=(1-fee);
      trades.push({type:'buy',price:c[i],date:md[i].date||md[i].time})}
    else if(hold&&aP&&!aN){hold=false;var sp=c[i]*(1-slip);var ret=sp/bp;tr*=ret*(1-fee);
      if(ret>=1)w++;else l++;
      trades.push({type:'sell',price:c[i],date:md[i].date||md[i].time,return:+((ret-1)*100).toFixed(1)})}
    var cv=hold?tr*(c[i]/bp):tr;if(cv>pk)pk=cv;var dd=(pk-cv)/pk*100;if(dd>mdd)mdd=dd;
    if(i>12)mRets.push(cv/(hold?tr*(c[i-1]/bp):tr)-1)
  }
  if(hold){var fr=c[c.length-1]*(1-slip)/bp;tr*=fr*(1-fee);if(fr>=1)w++;else l++}

  // v5: 벤치마크 (Buy & Hold - 동일 기간 수수료 포함)
  var bhStart=c[12],bhEnd=c[c.length-1];
  var buyAndHold=+((bhEnd/bhStart-1)*100*(1-fee*2)*(1-slip*2)).toFixed(1);
  var alpha=+((tr-1)*100-buyAndHold).toFixed(1);

  // v5: 샤프비율 (월간수익률 기반, 무위험=연 3%)
  var sharpe=null;
  if(mRets.length>3){
    var avgR=mRets.reduce(function(a,b){return a+b},0)/mRets.length;
    var stdR=Math.sqrt(mRets.reduce(function(a,b){return a+Math.pow(b-avgR,2)},0)/mRets.length);
    if(stdR>0)sharpe=+((avgR-0.03/12)/(stdR)*Math.sqrt(12)).toFixed(2)}

  return{totalReturn:+((tr-1)*100).toFixed(1),buyAndHold:buyAndHold,alpha:alpha,sharpe:sharpe,
    trades:trades,tradeCount:w+l,winRate:w+l>0?Math.round(w/(w+l)*100):0,wins:w,losses:l,
    maxDrawdown:+mdd.toFixed(1),holding:hold,feeRate:fee,slippage:slip}
}

function analyzeIdx(data){
  if(!data||data.length<30)return null;
  var c=data.map(function(d){return d.close}),last=data[data.length-1],prev=data[data.length-2];
  var chg=prev?+((last.close-prev.close)/prev.close*100).toFixed(2):0;
  var rsiObj=calcRSI(c,14),rsi=rsiObj?rsiObj.current:null;
  var ma5=calcMA(c,5),ma20=calcMA(c,20),ma60=calcMA(c,60);
  var trend='중립';
  if(last.close>ma20&&ma20>ma60)trend='상승추세';else if(last.close>ma20)trend='반등시도';
  else if(last.close<ma20&&(ma60?ma20<ma60:true))trend='하락추세';else trend='조정국면';
  var h52=Math.max.apply(null,c.slice(-Math.min(250,c.length)));
  return{price:last.close,change:chg,rsi:rsi,ma5:ma5,ma20:ma20,ma60:ma60,trend:trend,
    fromHigh:+((last.close-h52)/h52*100).toFixed(1),date:last.date}
}

/* ============================================
   v5: 차트 렌더링 (거래량 + BB 오버레이 + 마커)

function renderChart(el,data,tf,analysisData){
  if(!el||!data||!data.length)return null;el.innerHTML='';
  var candles=[],volData=[],seen={};
  data.forEach(function(d){
    var t=String(d.date||d.time);if(t.length===7)t+='-01';
    if(!/^\d{4}-\d{2}-\d{2}$/.test(t)||seen[t])return;seen[t]=true;
    var o=+d.open,h=+d.high,l=+d.low,c=+d.close;
    if(isNaN(o)||o<=0)return;
    candles.push({time:t,open:o,high:h,low:l,close:c});
    volData.push({time:t,value:d.volume||0,color:c>=o?'rgba(220,38,38,0.3)':'rgba(37,99,235,0.3)'})
  });
  candles.sort(function(a,b){return a.time<b.time?-1:1});
  volData.sort(function(a,b){return a.time<b.time?-1:1});
  if(!candles.length)return null;

  var chart=LightweightCharts.createChart(el,{width:el.clientWidth,height:400,
    layout:{background:{type:'solid',color:'#f8fafc'},textColor:'#334155',fontSize:12},
    grid:{vertLines:{color:'#e2e8f0'},horzLines:{color:'#e2e8f0'}},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
    timeScale:{borderColor:'#cbd5e1',barSpacing:tf==='day'?5:tf==='week'?8:18},
    rightPriceScale:{borderColor:'#cbd5e1'}});

  // 캔들스틱
  var cs=chart.addCandlestickSeries({upColor:'#dc2626',downColor:'#2563eb',borderUpColor:'#dc2626',borderDownColor:'#2563eb',wickUpColor:'#dc2626',wickDownColor:'#2563eb',lastValueVisible:true,priceLineVisible:true,priceLineWidth:2,priceLineStyle:0});
  cs.setData(candles);
  cs.priceScale().applyOptions({scaleMargins:{top:0.05,bottom:0.3}});
chart.timeScale().applyOptions({rightOffset:3});

  // v5: 거래량 오버레이
  var volSeries=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'vol',color:'#94a3b8'});
  volSeries.priceScale().applyOptions({scaleMargins:{top:0.75,bottom:0}});
  volSeries.setData(volData);

  // 이동평균
  function cma(d,p){var r=[];for(var i=0;i<d.length;i++){if(i<p-1){r.push({time:d[i].time});continue}
    var s=0;for(var j=0;j<p;j++)s+=d[i-j].close;r.push({time:d[i].time,value:+(s/p).toFixed(2)})}return r}
  [{p:5,c:'#f59e0b',w:1},{p:20,c:'#22c55e',w:2},{p:60,c:'#3b82f6',w:2},{p:120,c:'#a855f7',w:2}].forEach(function(m){
    if(candles.length>=m.p)chart.addLineSeries({color:m.c,lineWidth:m.w,lastValueVisible:false,priceLineVisible:false}).setData(cma(candles,m.p))});
if(tf==='month'&&candles.length>=12){chart.addLineSeries({color:'#ef4444',lineWidth:3,lastValueVisible:false,priceLineVisible:false}).setData(cma(candles,12))}

  // v5: 볼린저밴드 오버레이
  if(candles.length>=20){
    var bbUpper=[],bbLower=[],bbMid=[];
    for(var i=0;i<candles.length;i++){
      if(i<19){bbUpper.push({time:candles[i].time});bbLower.push({time:candles[i].time});bbMid.push({time:candles[i].time});continue}
      var sl=candles.slice(i-19,i+1),avg=sl.reduce(function(a,b){return a+b.close},0)/20;
      var vr=sl.reduce(function(a,b){return a+Math.pow(b.close-avg,2)},0)/20,std=Math.sqrt(vr);
      bbUpper.push({time:candles[i].time,value:+(avg+2*std).toFixed(2)});
      bbLower.push({time:candles[i].time,value:+(avg-2*std).toFixed(2)});
      bbMid.push({time:candles[i].time,value:+avg.toFixed(2)})}
    chart.addLineSeries({color:'rgba(139,92,246,0.4)',lineWidth:1,lineStyle:2,lastValueVisible:false,priceLineVisible:false}).setData(bbUpper);
    chart.addLineSeries({color:'rgba(139,92,246,0.4)',lineWidth:1,lineStyle:2,lastValueVisible:false,priceLineVisible:false}).setData(bbLower);
    chart.addLineSeries({color:'rgba(139,92,246,0.2)',lineWidth:1,lineStyle:1,lastValueVisible:false,priceLineVisible:false}).setData(bbMid);
  }
// v5.1: 차트 범례 + 실시간 값 표시
  var tfUnit=tf==='day'?'일':tf==='week'?'주':'개월';
  var maSeriesMap=[];
  var maConfigs=[{p:5,c:'#f59e0b',n:'5'+tfUnit},{p:20,c:'#22c55e',n:'20'+tfUnit},{p:60,c:'#3b82f6',n:'60'+tfUnit},{p:120,c:'#a855f7',n:'120'+tfUnit}];
  if(tf==='month')maConfigs.push({p:12,c:'#ef4444',n:'12개월'});

  var legendDiv=document.createElement('div');
  legendDiv.style.cssText='display:flex;flex-wrap:wrap;gap:8px;font-size:12px;background:#f8fafc;padding:8px 12px;border-radius:8px;cursor:pointer;border:1px solid #e2e8f0;margin-bottom:6px;';

  var explainMap={
    '5':'초단기 추세. 최근 5기간 평균가격. 빠른 방향 전환 감지.',
    '20':'단기 추세. 1개월(일봉) 평균. 볼린저밴드 중심선.',
    '60':'중기 추세. 3개월(일봉) 평균. 기관 매매 기준선.',
    '120':'장기 추세. 6개월(일봉) 평균. 대세 방향 판단.',
    '12':'월봉 장기 추세. 1년 평균. 골든/데드크로스 핵심 지표.',
    'BB':'볼린저밴드. 주가 변동성 범위. 상단돌파=과매수, 하단이탈=과매도, 수축=큰 움직임 예고.'
  };
  var shortDesc={'5':'1주추세','20':'1개월추세','60':'3개월추세','120':'6개월추세','12':'1년추세'};

  maConfigs.forEach(function(m){
    var span=document.createElement('span');
    span.style.cssText='display:flex;align-items:center;gap:3px;padding:2px 6px;border-radius:4px;transition:background 0.2s;';
    span.innerHTML='<span style="display:inline-block;width:16px;height:3px;background:'+m.c+';border-radius:2px;"></span><b>'+m.n+'</b><span style="color:#999;font-size:12px;">'+(shortDesc[String(m.p)]||'')+'</span><span class="ma-val" style="color:#666;min-width:50px;"></span>';
    span.onmouseenter=function(){this.style.background='#f0f0f0'};
    span.onmouseleave=function(){this.style.background='transparent'};
    span.onclick=function(e){e.stopPropagation();alert('📊 '+m.n+' 이동평균선\n\n'+explainMap[String(m.p)])};
    legendDiv.appendChild(span);
    maSeriesMap.push({span:span,period:m.p});
  });

  var bbSpan=document.createElement('span');
  bbSpan.style.cssText='display:flex;align-items:center;gap:3px;padding:2px 6px;border-radius:4px;transition:background 0.2s;';
  bbSpan.innerHTML='<span style="display:inline-block;width:16px;height:0;border-top:2px dashed #8b5cf6;"></span><b>BB상/하</b><span style="color:#8b5cf6;font-size:11px;">(보라점선)위=과매수,아래=과매도</span><span class="bb-val" style="color:#666;min-width:80px;"></span>';
  bbSpan.onmouseenter=function(){this.style.background='#f0f0f0'};
  bbSpan.onmouseleave=function(){this.style.background='transparent'};
  bbSpan.onclick=function(e){e.stopPropagation();alert('📊 볼린저밴드(BB)\n\n'+explainMap['BB'])};
legendDiv.appendChild(bbSpan);

  var fibSSpan=document.createElement('span');
  fibSSpan.style.cssText='display:flex;align-items:center;gap:3px;padding:2px 6px;border-radius:4px;transition:background 0.2s;';
  fibSSpan.innerHTML='<span style="display:inline-block;width:16px;height:0;border-top:2px dashed #22c55e;"></span><b>S지지</b><span style="color:#999;font-size:12px;">반등예상</span>';
  fibSSpan.onmouseenter=function(){this.style.background='#f0f0f0'};
  fibSSpan.onmouseleave=function(){this.style.background='transparent'};
  fibSSpan.onclick=function(e){e.stopPropagation();alert('📊 피보나치 지지선(S)\n\n가격이 하락할 때 반등할 가능성이 높은 구간입니다.\nS79% = 피보나치 78.6% 되돌림 레벨\n\n이 선 아래로 떨어지면 지지 실패로 추가 하락 가능.\n이 선에서 반등하면 매수 기회.')};
  legendDiv.appendChild(fibSSpan);

  var fibRSpan=document.createElement('span');
  fibRSpan.style.cssText='display:flex;align-items:center;gap:3px;padding:2px 6px;border-radius:4px;transition:background 0.2s;';
  fibRSpan.innerHTML='<span style="display:inline-block;width:16px;height:0;border-top:2px dashed #ef4444;"></span><b>R저항</b><span style="color:#999;font-size:12px;">천장예상</span>';
  fibRSpan.onmouseenter=function(){this.style.background='#f0f0f0'};
  fibRSpan.onmouseleave=function(){this.style.background='transparent'};
  fibRSpan.onclick=function(e){e.stopPropagation();alert('📊 피보나치 저항선(R)\n\n가격이 상승할 때 막힐 가능성이 높은 구간입니다.\nR62% = 피보나치 61.8% 되돌림 레벨\n\n이 선을 돌파하면 강한 상승 신호.\n이 선에서 막히면 매도/관망 고려.')};
  legendDiv.appendChild(fibRSpan);

  el.insertBefore(legendDiv,el.firstChild);

  // 실시간 값 표시
  chart.subscribeCrosshairMove(function(param){
    if(!param||!param.time){
      maSeriesMap.forEach(function(ms){ms.span.querySelector('.ma-val').textContent=''});
      bbSpan.querySelector('.bb-val').textContent='';
      return;
    }
    var idx=-1;
    for(var i=0;i<candles.length;i++){if(candles[i].time===param.time){idx=i;break}}
    if(idx===-1)return;

    maSeriesMap.forEach(function(ms){
      var valEl=ms.span.querySelector('.ma-val');
      if(idx>=ms.period-1){
        var sum=0;for(var j=0;j<ms.period;j++)sum+=candles[idx-j].close;
        var avg=Math.round(sum/ms.period);
        valEl.textContent=' '+avg.toLocaleString();
      }else{valEl.textContent=''}
    });

    if(idx>=19){
      var sl=candles.slice(idx-19,idx+1),avg20=sl.reduce(function(a,b){return a+b.close},0)/20;
      var vr=sl.reduce(function(a,b){var d=b.close-avg20;return a+d*d},0)/20;
      var sd=Math.sqrt(vr),upper=Math.round(avg20+2*sd),lower=Math.round(avg20-2*sd);
      bbSpan.querySelector('.bb-val').textContent=' '+upper.toLocaleString()+'~'+lower.toLocaleString();
    }else{bbSpan.querySelector('.bb-val').textContent=''}
  });
  // v5: 매수/매도 마커 (분석 데이터에서 신호 추출)
  if(analysisData&&analysisData.signals){
    var markers=[];var lastDate=candles[candles.length-1].time;
    analysisData.signals.forEach(function(sig){
      if(sig.type==='buy'&&(sig.text.indexOf('골든크로스')!==-1||sig.text.indexOf('다이버전스')!==-1)){
        markers.push({time:lastDate,position:'belowBar',color:'#16a34a',shape:'arrowUp',text:sig.text.substring(0,10)})}
      else if(sig.type==='sell'&&(sig.text.indexOf('데드크로스')!==-1||sig.text.indexOf('다이버전스')!==-1)){
        markers.push({time:lastDate,position:'aboveBar',color:'#ef4444',shape:'arrowDown',text:sig.text.substring(0,10)})}
    });
    if(markers.length>0){try{cs.setMarkers(markers)}catch(e){}}
  }

  // v5: 피보나치 지지/저항선
  if(analysisData&&analysisData.fib){
    var fb=analysisData.fib;
    if(fb.support)try{cs.createPriceLine({price:fb.support.p,color:'#22c55e',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'지지S'+Math.round(fb.support.r*100)+'%'})}catch(e){}

function genPrompt(results,type,market,env){
  var lines=['['+(market==='us'?'미국':'한국')+' '+type+' v5 분석]',''];
  var top=results.filter(function(r){return r.scores.total>=65}).slice(0,5);
  var bot=results.filter(function(r){return r.scores.total<35}).slice(0,5);
  if(top.length){lines.push('■ 매수후보:');top.forEach(function(r){
    var fl=r.financial?(' ROE:'+(r.financial.roe||'-')+'% 부채:'+(r.financial.debtRatio||'-')+'%'+(r.financial.per?' PER:'+r.financial.per:'')):'';
    var div=r.rsiDivergence?(' [RSI다이버전스:'+r.rsiDivergence+']'):'';
    lines.push('  '+r.symbol+' '+r.scores.total+'점 RSI:'+(r.rsi14||'-')+' ADX:'+(r.adx||'-')+' '+r.verdict+' '+(r.ma12Signal||'')+fl+div)});lines.push('')}
  if(bot.length){lines.push('■ 매도주의:');bot.forEach(function(r){lines.push('  '+r.symbol+' '+r.scores.total+'점 '+r.verdict)});lines.push('')}
  if(env){lines.push('■ 시장환경: 온도 '+env.temperature+' ('+env.tempLabel+')');
    env.indexes.forEach(function(idx){if(idx.data)lines.push('  '+idx.name+': '+idx.data.trend+' RSI:'+idx.data.rsi+' 52주:'+idx.data.fromHigh+'%')});lines.push('')}
  lines.push('분석요청: 1.매수TOP3 진입/목표/손절 2.시장환경 반영 3.재무건전성 4.RSI다이버전스 해석 5.ADX추세강도 고려 6.리스크');
  return lines.join('\n')
}

// v5: 배치 병렬 요청
function batchFetch(items,fetchFn,batchSize,delay){
  batchSize=batchSize||3;delay=delay||400;
  var results=[];var idx=0;
  return new Promise(function(resolve){
    function nextBatch(){
      if(idx>=items.length){resolve(results);return}
      var batch=items.slice(idx,idx+batchSize);idx+=batchSize;
      Promise.all(batch.map(function(item){return fetchFn(item).catch(function(){return null})}))
        .then(function(batchResults){results=results.concat(batchResults);setTimeout(nextBatch,delay)})
    }
    nextBatch()
  })
}

function calcCorrelation(a,b){
  var n=Math.min(a.length,b.length);if(n<20)return null;
  var aa=a.slice(-n),bb=b.slice(-n);
  var ra=[],rb=[];
  for(var i=1;i<aa.length;i++){ra.push((aa[i]-aa[i-1])/aa[i-1]);rb.push((bb[i]-bb[i-1])/bb[i-1])}
  var ma=ra.reduce(function(s,v){return s+v},0)/ra.length;
  var mb=rb.reduce(function(s,v){return s+v},0)/rb.length;
  var num=0,da=0,db=0;
  for(var j=0;j<ra.length;j++){var x=ra[j]-ma,y=rb[j]-mb;num+=x*y;da+=x*x;db+=y*y}
  var denom=Math.sqrt(da)*Math.sqrt(db);
  return denom===0?0:+(num/denom).toFixed(3);
}

function analyzePortfolioCorr(holdingSymbols,market){
  var results=[];var fetched={};var symbols=holdingSymbols.filter(function(s){return getCode(s)||/^[A-Z]+$/.test(s)});
  if(symbols.length<2)return Promise.resolve(null);
  return new Promise(function(resolve){
    var idx=0;
    function next(){
      if(idx>=symbols.length){
        var pairs=[],totalCorr=0,cnt=0;
        for(var i=0;i<symbols.length;i++){
          for(var j=i+1;j<symbols.length;j++){
            if(fetched[symbols[i]]&&fetched[symbols[j]]){
              var corr=calcCorrelation(fetched[symbols[i]],fetched[symbols[j]]);
              if(corr!==null){pairs.push({a:symbols[i],b:symbols[j],corr:corr});totalCorr+=Math.abs(corr);cnt++}
            }
          }
        }
        pairs.sort(function(a,b){return Math.abs(b.corr)-Math.abs(a.corr)});
        var avgCorr=cnt>0?+(totalCorr/cnt).toFixed(3):0;
        var grade=avgCorr<=0.3?'A (우수)':avgCorr<=0.5?'B (양호)':avgCorr<=0.7?'C (보통)':'D (집중)';
        resolve({pairs:pairs,avgCorr:avgCorr,grade:grade,count:symbols.length});
        return;
      }
      var sym=symbols[idx];idx++;
      var isUS=/^[A-Z\^]+$/.test(sym)&&!getCode(sym);
      var fn=isUS?fetchUsD:fetchKrD;
      fn(sym).then(function(d){
        if(d&&d.length>=20)fetched[sym]=d.map(function(x){return x.close});
        setTimeout(next,200);
      }).catch(function(){setTimeout(next,200)});
    }
    next();
  });
}

    }catch(e){continue}
  }
  results.sort(function(a,b){return b.score-a.score});
  return results;
}

async function fetchAnalyst(code){
  try{
    var res=await fetch(WORKER_BASE+'/naver/stock?code='+code);
    var json=await res.json();
    var info={};
    if(json.totalInfos){
      json.totalInfos.forEach(function(t){
        var k=t.key||t.code||'';
        var v=(t.value||t.rateValue||'').replace(/,/g,'').replace(/백만/g,'').replace(/배/g,'').replace(/원/g,'').replace(/%/g,'').replace(/조/g,'').replace(/억/g,'');
        info[k]=v;
      });
    }
    var cp=Number(info['전일'])||0;

      low52:Number(info['52주 최저'])||0,
      irSchedule:json.irScheduleInfo||null,
      foreignSell3d:(json.dealTrendInfos||[]).slice(0,3).reduce(function(sum,dt){var v=Number(String(dt.foreignerPureBuyQuant||'0').replace(/,/g,'').replace(/\+/g,''));return v<0?sum+Math.abs(v):sum},0),
      institutionSell3d:(json.dealTrendInfos||[]).slice(0,3).reduce(function(sum,dt){var v=Number(String(dt.organPureBuyQuant||'0').replace(/,/g,'').replace(/\+/g,''));return v<0?sum+Math.abs(v):sum},0),

    };
  }catch(e){return null}
}
function detectCandlePatterns(daily){
  if(!daily||daily.length<12)return[];
  var patterns=[];
  var d=daily,len=d.length;
  var avgBody=0;for(var i=len-11;i<len-1;i++)avgBody+=Math.abs(d[i].close-d[i].open);avgBody/=10;
  var tol=avgBody*0.3;

  // ⭐ 학술 데이터 (Bulkowski 2008 기반 정직한 적중률)
 // ⭐ Phase 1: 캔들패턴 표기를 "역사적 빈도"로 명시
// 출처: Bulkowski (2008) "Encyclopedia of Candlestick Charts" - 미국 주식 1980~2008
// ⚠️ 한국 시장 / 2026년 시장에 직접 적용 시 정확도 차이 가능
// ⚠️ Marshall et al. (2017) 메타분석: 캔들패턴 단독 적중률 52~55% 수준
var BULKOWSKI={
  '상승장악형':{rate:62,sample:'미국주식 15,200건',market:'US 1980-2008',warn:'한국시장 미검증'},
    '하락장악형':{rate:65,sample:'미국주식 14,800건',market:'US 1980-2008',warn:'한국시장 미검증'},
    '모닝스타':{rate:65,sample:'미국주식 7,100건',market:'US 1980-2008',warn:'한국시장 미검증 · 3봉 패턴은 갭 영향 큼'},
    '이브닝스타':{rate:67,sample:'미국주식 6,900건',market:'US 1980-2008',warn:'한국시장 미검증 · 3봉 패턴은 갭 영향 큼'},
    '망치형(반등)':{rate:60,sample:'미국주식 12,400건',market:'US 1980-2008',warn:'한국시장 미검증'},
    '유성형(하락)':{rate:59,sample:'미국주식 8,300건',market:'US 1980-2008',warn:'한국시장 미검증'},
    '쓰리화이트솔저':{rate:58,sample:'미국주식 4,200건',market:'US 1980-2008',warn:'한국시장 미검증'},
    '쓰리블랙크로우':{rate:67,sample:'미국주식 4,500건',market:'US 1980-2008',warn:'한국시장 미검증'},
    '하라미(양봉)':{rate:53,sample:'미국주식 9,800건',market:'US 1980-2008',warn:'단독 사용 비추천 · 동전던지기 수준'},
    '도지':{rate:50,sample:'추세 의존적',market:'학술 근거 부족',warn:'단독 사용 금지 · 추세 확인 필수'},
    '대형양봉+거래량':{rate:58,sample:'자체 추정 · 통계검증 미실시',market:'근거 부족',warn:'⚠️ 학술 출처 없음 · 참고만'},
    '대형음봉+거래량':{rate:58,sample:'자체 추정 · 통계검증 미실시',market:'근거 부족',warn:'⚠️ 학술 출처 없음 · 참고만'}
};


  for(var day=0;day<3;day++){
    if(len-1-day<2)break;
    var c0=d[len-1-day],c1=d[len-2-day],c2=d[len-3-day];
    var body0=Math.abs(c0.close-c0.open),body1=Math.abs(c1.close-c1.open),body2=Math.abs(c2.close-c2.open);
    var upper0=c0.high-Math.max(c0.open,c0.close),lower0=Math.min(c0.open,c0.close)-c0.low;
    var bull0=c0.close>c0.open,bear0=c0.close<c0.open;
    var bull1=c1.close>c1.open,bear1=c1.close<c1.open;
    var bull2=c2.close>c2.open,bear2=c2.close<c2.open;
    var refIdx=len-6-day;if(refIdx<0)refIdx=0;
    var trend5=c0.close>d[refIdx].close?'up':'down';
    var tag=day===0?'(오늘)':day===1?'(어제)':'(2일전)';
    var prevVol=len-2-day>=0?d[len-2-day].volume:c0.volume;

    // 1. 상승장악형 (역사적 빈도 62%)
    if(bear1&&bull0&&c0.open<=c1.close+tol&&c0.close>=c1.open-tol&&body0>body1*0.7&&trend5==='down'){
      var r=BULKOWSKI['상승장악형'];
      patterns.push({name:'상승장악형'+tag,type:'buy',strength:r.rate,sample:r.sample,desc:'하락 후 양봉이 전일 음봉을 감쌈. 역사적 빈도 '+r.rate+'% (Bulkowski 2008, '+r.sample+'). ⚠️ 한국시장 적중률은 다를 수 있음.',action:'다음 봉 시가 분할매수. 전일 저가 손절.'})}

    // 2. 하락장악형 (65%)
    if(bull1&&bear0&&c0.open>=c1.close-tol&&c0.close<=c1.open+tol&&body0>body1*0.7&&trend5==='up'){
      var r2=BULKOWSKI['하락장악형'];
      patterns.push({name:'하락장악형'+tag,type:'sell',strength:r2.rate,sample:r2.sample,desc:'상승 후 음봉이 전일 양봉을 감쌈. 역사적 빈도 '+r2.rate+'%.',action:'익절 또는 비중 축소.'})}

    // 3. 모닝스타 (65%)
    if(bear2&&body2>avgBody*0.7&&body1<avgBody*0.7&&bull0&&c0.close>=(c2.open+c2.close)/2-tol){
      var r3=BULKOWSKI['모닝스타'];
      patterns.push({name:'모닝스타'+tag,type:'buy',strength:r3.rate,sample:r3.sample,desc:'대형음봉→소형봉→대형양봉. 역사적 빈도 '+r3.rate+'%.',action:'양봉 확인 후 매수. 1번째 음봉 저가가 손절.'})}

    // 4. 이브닝스타 (67%)
    if(bull2&&body2>avgBody*0.7&&body1<avgBody*0.7&&bear0&&c0.close<=(c2.open+c2.close)/2+tol){
      var r4=BULKOWSKI['이브닝스타'];
      patterns.push({name:'이브닝스타'+tag,type:'sell',strength:r4.rate,sample:r4.sample,desc:'대형양봉→소형봉→대형음봉. 역사적 빈도 '+r4.rate+'%.',action:'즉시 익절 고려. 50%↑ 비중 축소.'})}

    // 5. 망치형 (60%)
    if(lower0>body0*1.5&&upper0<body0*0.8&&body0>0&&trend5==='down'){
      var r5=BULKOWSKI['망치형(반등)'];
      patterns.push({name:'망치형'+tag,type:'buy',strength:r5.rate,sample:r5.sample,desc:'긴 아래꼬리. 역사적 빈도 '+r5.rate+'%.',action:'다음 봉 양봉 확인 후 매수.'})}

    // 6. 유성형 (59%)
    if(upper0>body0*1.5&&lower0<body0*0.8&&body0>0&&trend5==='up'){
      var r6=BULKOWSKI['유성형(하락)'];
      patterns.push({name:'유성형'+tag,type:'sell',strength:r6.rate,sample:r6.sample,desc:'긴 위꼬리. 역사적 빈도 '+r6.rate+'%.',action:'추격매수 금지. 손절 타이트하게.'})}

    // 7. 쓰리화이트솔저 (58%)
    if(bull0&&bull1&&bull2&&c0.close>c1.close&&c1.close>c2.close&&body0>avgBody*0.5&&body1>avgBody*0.5&&body2>avgBody*0.5){
      var r7=BULKOWSKI['쓰리화이트솔저'];
      patterns.push({name:'쓰리화이트솔저'+tag,type:'buy',strength:r7.rate,sample:r7.sample,desc:'3일 연속 양봉. 역사적 빈도 '+r7.rate+'%.',action:'추세 추종 매수. 첫째 양봉 저가 손절.'})}

    // 8. 쓰리블랙크로우 (67%)
    if(bear0&&bear1&&bear2&&c0.close<c1.close&&c1.close<c2.close&&body0>avgBody*0.5&&body1>avgBody*0.5&&body2>avgBody*0.5){
      var r8=BULKOWSKI['쓰리블랙크로우'];
      patterns.push({name:'쓰리블랙크로우'+tag,type:'sell',strength:r8.rate,sample:r8.sample,desc:'3일 연속 음봉. 역사적 빈도 '+r8.rate+'%.',action:'즉시 매도. 반등 시 추가 매도.'})}

    // 9. 하라미 (53%)
    if(bear1&&bull0&&body0<body1*0.6&&c0.high<=c1.open+tol&&c0.low>=c1.close-tol){
      var r9=BULKOWSKI['하라미(양봉)'];
      patterns.push({name:'하라미(양봉)'+tag,type:'buy',strength:r9.rate,sample:r9.sample,desc:'대형 음봉 안 소형 양봉. 역사적 빈도 '+r9.rate+'%(약함).',action:'단독 사용 비추천. 보조지표 병행.'})}

    // 10. 도지 (50%, 추세 의존)
    if(body0<avgBody*0.2&&(upper0+lower0)>body0*2){
      var dType=trend5==='up'?'sell':'buy';
      var r10=BULKOWSKI['도지'];
      patterns.push({name:'도지'+tag,type:dType,strength:r10.rate,sample:r10.sample,desc:'시가≈종가. 추세 의존, 적중률 '+r10.rate+'%(약함).',action:trend5==='up'?'다음 봉 음봉이면 매도':'다음 봉 양봉이면 매수'})}

    // 11. 대형양봉+거래량 (58%)
    if(bull0&&body0>avgBody*1.8&&c0.volume>prevVol*1.0){
      var r11=BULKOWSKI['대형양봉+거래량'];
      patterns.push({name:'대형양봉+거래량'+tag,type:'buy',strength:r11.rate,sample:r11.sample,desc:'1.8배 큰 양봉 + 거래량 증가. 적중률 '+r11.rate+'%(추정).',action:'눌림목 매수 대기. 당일 저가 손절.'})}

    // 12. 대형음봉+거래량 (58%)
    if(bear0&&body0>avgBody*1.8&&c0.volume>prevVol*1.0){
      var r12=BULKOWSKI['대형음봉+거래량'];
      patterns.push({name:'대형음봉+거래량'+tag,type:'sell',strength:r12.rate,sample:r12.sample,desc:'1.8배 큰 음봉 + 거래량 증가. 적중률 '+r12.rate+'%(추정).',action:'즉시 매도 또는 비중 축소.'})}
  }

  // 중복 제거
  var seen={};
  patterns=patterns.filter(function(p){var key=p.name.replace(/\(.*\)/,'')+p.type;if(seen[key])return false;seen[key]=true;return true;});
  
  // 복합 신호 분석 (정직한 신뢰도로 변경)
  var c=d[len-1],c1b=d[len-2];
  var rsi14=0,gains=0,losses=0;
  for(var ri=len-14;ri<len;ri++){var diff=d[ri].close-d[ri-1].close;if(diff>0)gains+=diff;else losses-=diff;}
  var avgGain=gains/14,avgLoss=losses/14;
  rsi14=avgLoss===0?100:+(100-100/(1+avgGain/avgLoss)).toFixed(1);

  var ema12=d[len-13].close,ema26=d[len-27]?d[len-27].close:d[0].close;
  for(var mi=len-12;mi<len;mi++)ema12=ema12*0.846+d[mi].close*0.154;
  for(var mi2=len-26;mi2<len;mi2++)ema26=ema26*0.926+d[mi2].close*0.074;
  var macdLine=ema12-ema26;
  var prevEma12=d[len-14].close,prevEma26=d[len-28]?d[len-28].close:d[0].close;
  for(var pi=len-13;pi<len-1;pi++)prevEma12=prevEma12*0.846+d[pi].close*0.154;
  for(var pi2=len-27;pi2<len-1;pi2++)prevEma26=prevEma26*0.926+d[pi2].close*0.074;
  var prevMacd=prevEma12-prevEma26;
  var macdCross=prevMacd<0&&macdLine>0?'golden':prevMacd>0&&macdLine<0?'dead':null;

  var volAvg5=0;for(var vi=len-6;vi<len-1;vi++)volAvg5+=d[vi].volume;volAvg5/=5;
  var volRatio=volAvg5>0?+(c.volume/volAvg5*100).toFixed(0):100;

  var buyCount=0,sellCount=0,buyReasons=[],sellReasons=[];
  if(rsi14<=40){buyCount++;buyReasons.push('RSI '+rsi14+' 과매도권');}
  if(rsi14>=70){sellCount++;sellReasons.push('RSI '+rsi14+' 과매수권');}
  if(macdCross==='golden'){buyCount++;buyReasons.push('MACD 골든크로스');}
  if(macdCross==='dead'){sellCount++;sellReasons.push('MACD 데드크로스');}
  if(volRatio>=150){buyCount++;buyReasons.push('거래량 '+volRatio+'% 급증');}
  var hasBuyPattern=patterns.some(function(p){return p.type==='buy'&&p.strength>=60;});
  var hasSellPattern=patterns.some(function(p){return p.type==='sell'&&p.strength>=60;});
  if(hasBuyPattern){buyCount++;buyReasons.push('학술적 매수 캔들패턴');}
  if(hasSellPattern){sellCount++;sellReasons.push('학술적 매도 캔들패턴');}
  var trend5b=c.close>d[Math.max(0,len-6)].close?'up':'down';
  if(c.close>c1b.close&&trend5b==='down'){buyCount++;buyReasons.push('하락추세 반등');}
  if(c.close<c1b.close&&trend5b==='up'){sellCount++;sellReasons.push('상승추세 눌림');}

  // ⭐ Phase 1: 자극적 표현 제거 - "강력 매수 95%" → 조건 충족 개수로 표시
if(buyCount>=3){
  patterns.unshift({name:'다중 매수 조건 충족 ('+buyCount+'/6)',type:'buy',strength:buyCount,sample:'주관적 휴리스틱',
    desc:buyCount+'/6개 매수 조건 충족: '+buyReasons.join(', ')+'. ⚠️ 확률이 아닌 조건 개수입니다.',
    action:'분할 매수 검토. 손절 ATR×1.5 또는 전일 저가. 최소 2가지 이상 검증된 보조지표 병행 권장.'});
}else if(buyCount===2){
  patterns.unshift({name:'매수 관심 조건 ('+buyCount+'/6)',type:'buy',strength:buyCount,sample:'주관적 휴리스틱',
    desc:buyCount+'/6개 매수 조건 충족: '+buyReasons.join(', ')+'. ⚠️ 확률이 아닌 조건 개수입니다.',
    action:'관망 후 추가 확인 시 소량 진입.'});
}
if(sellCount>=3){
  patterns.unshift({name:'다중 매도 조건 충족 ('+sellCount+'/6)',type:'sell',strength:sellCount,sample:'주관적 휴리스틱',
    desc:sellCount+'/6개 매도 조건 충족: '+sellReasons.join(', ')+'. ⚠️ 확률이 아닌 조건 개수입니다.',
    action:'익절 또는 비중 축소.'});
}else if(sellCount===2){
  patterns.unshift({name:'매도 관심 조건 ('+sellCount+'/6)',type:'sell',strength:sellCount,sample:'주관적 휴리스틱',
    desc:sellCount+'/6개 매도 조건 충족: '+sellReasons.join(', ')+'. ⚠️ 확률이 아닌 조건 개수입니다.',
    action:'손절라인 타이트하게.'});
}

  return patterns;
}
window.detectCandlePatterns=detectCandlePatterns;

window.fetchAnalyst=fetchAnalyst;
window.importBackup=importBackup;

<script type="text/babel">
const {useState,useRef,useEffect,useCallback,useMemo}=React;

function ScoreRing({score,size}){
  size=size||60;var r=size/2-4,circ=2*Math.PI*r,off=circ*(1-score/100);
  var color=score>=70?'#16a34a':score>=50?'#eab308':score>=35?'#f97316':'#ef4444';
  return <div className="score-ring" style={{width:size,height:size}}>
    <svg width={size} height={size}><circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#e2e8f0" strokeWidth={4}/>
    <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={4} strokeDasharray={circ} strokeDashoffset={off} strokeLinecap="round"/></svg>
    <div className="score-text" style={{color,fontSize:size>50?16:13}}>{score}</div></div>
}

function SigBadge({sig,onClick}){

  var hasEx=!!findSigExplain(sig.text);
  return <button className={'sig-badge-btn inline-flex items-center gap-1 px-2 py-1 rounded-lg text-xs font-bold '+bg}
    onClick={e=>{e.stopPropagation();if(onClick)onClick(sig.text)}} title={hasEx?'클릭→상세설명':''}>
    {sig.type==='buy'?'▲':sig.type==='sell'?'▼':sig.type==='warn'?'⚠':'ℹ'} {sig.text}{hasEx&&' 🔍'}</button>
}

function HoldingAnalyst({symbol}){
  var [d,setD]=useState(null);
  var [alert,setAlert]=useState([]);
  useEffect(function(){var code=KR_CODE[symbol]||symbol;if(!code)return;
    fetch(WORKER_BASE+'/naver/stock?code='+code).then(function(r){return r.json()}).then(function(json){
      var info={};
      if(json.totalInfos)json.totalInfos.forEach(function(t){var k=t.key||t.code||'';var v=(t.value||t.rateValue||'').replace(/,/g,'');info[k]=v;});
      var con=json.consensusInfo||{};
      var tp=Number((con.priceTargetMean||'0').replace(/,/g,''))||0;
      var cp=Number(info['전일'])||0;
      var gap=tp>0&&cp>0?+(((tp-cp)/cp)*100).toFixed(1):0;
      var rating=Number(con.recommMean)||0;
      var foreignRatio=parseFloat(info['외인소진율'])||0;
      var dividend=parseFloat(info['배당수익률'])||0;
      var irSchedule=json.irScheduleInfo||null;
      setD({targetPrice:tp,gap:gap,rating:rating,foreignRatio:foreignRatio,dividend:dividend,irSchedule:irSchedule});
      var alerts=[];
      if(json.dealTrendInfos&&json.dealTrendInfos.length>=2){
        var recent=json.dealTrendInfos.slice(0,3);
        var foreignSell=0;
        recent.forEach(function(dt){
          var fv=Number(String(dt.foreignerPureBuyQuant||'0').replace(/,/g,''));
          if(fv<0)foreignSell+=Math.abs(fv);
        });
        if(foreignSell>1000000)alerts.push('🚨 외국인 3일간 '+Math.round(foreignSell/10000)+'만주 순매도');
        var institutionSell=0;
        recent.forEach(function(dt){
          var iv=Number(String(dt.organPureBuyQuant||'0').replace(/,/g,''));
          if(iv<0)institutionSell+=Math.abs(iv);
        });
        if(institutionSell>500000)alerts.push('🚨 기관 3일간 '+Math.round(institutionSell/10000)+'만주 순매도');
      }
      setAlert(alerts);
    }).catch(function(){});
  },[symbol]);
  if(!d)return null;
  return <div className="mt-2">
    <div className="flex flex-wrap gap-2 text-xs">
      {d.targetPrice>0&&<span className="px-2 py-0.5 rounded bg-blue-50 text-blue-700">목표 {d.targetPrice.toLocaleString()} ({d.gap>0?'+':''}{d.gap}%)</span>}
      {d.rating>0&&<span className="px-2 py-0.5 rounded bg-purple-50 text-purple-700">평점 {d.rating}/5</span>}
      {d.foreignRatio>0&&<span className="px-2 py-0.5 rounded bg-gray-50 text-gray-700">외인 {d.foreignRatio}%</span>}
      {d.dividend>0&&<span className="px-2 py-0.5 rounded bg-green-50 text-green-700">배당 {d.dividend}%</span>}
      {d.irSchedule&&d.irSchedule.date&&<span className="px-2 py-0.5 rounded bg-amber-50 text-amber-700">📅 IR {d.irSchedule.date}</span>}
    </div>
    {alert.length>0&&<div className="mt-1">{alert.map(function(a,i){return <p key={i} className="text-xs font-bold text-red-500 bg-red-50 rounded px-2 py-1 mt-1">{a}</p>})}</div>}
  </div>
}

function PnlSimulator({data,market}){
  if(!data||!data.price)return null;
  var price=data.price;
  var defaultStop=Math.round(price*0.95);
  var defaultTarget=Math.round(price*1.10);
  if(data.atr&&data.atr.stopLoss&&data.atr.stopLoss<price&&data.atr.stopLoss>price*0.85)defaultStop=Math.round(data.atr.stopLoss);
  if(data.atr&&data.atr.target&&data.atr.target>price&&data.atr.target<price*1.30)defaultTarget=Math.round(data.atr.target);
  var [buyPrice,setBuyPrice]=useState(String(price));
  var [qty,setQty]=useState('10');
  var [stopPrice,setStopPrice]=useState(String(defaultStop));
  var [targetPrice,setTargetPrice]=useState(String(defaultTarget));
  var bp=Number(buyPrice)||0,q=Number(qty)||0,sp=Number(stopPrice)||0,tp=Number(targetPrice)||0;
  var totalCost=bp*q;
  var lossAmt=(bp-sp)*q;
  var gainAmt=(tp-bp)*q;
  var lossPct=bp>0?(((sp-bp)/bp)*100).toFixed(1):'0';
  var gainPct=bp>0?(((tp-bp)/bp)*100).toFixed(1):'0';
  var rr=lossAmt>0?(gainAmt/lossAmt).toFixed(1):'-';
  var rrColor=rr==='-'?'text-gray-500':Number(rr)>=2?'text-green-600':Number(rr)>=1?'text-yellow-600':'text-red-500';
  var rrLabel=rr==='-'?'미설정':Number(rr)>=2?'A 우수':Number(rr)>=1?'C 보통':'D 불리';
  var pfx=market==='us'?'$':'';
  return <div className="bg-purple-50 rounded-xl p-3 mb-3 border-2 border-purple-200">
    <p className="text-sm font-bold text-purple-700 mb-2">📊 손익 시뮬레이터</p>
    <div className="grid grid-cols-4 gap-2 mb-2">
      <div><label className="text-xs text-gray-600 block mb-1">매수가</label><input type="number" value={buyPrice} onChange={e=>setBuyPrice(e.target.value)} className="w-full px-2 py-1.5 border-2 border-gray-200 rounded text-xs font-bold"/></div>
      <div><label className="text-xs text-gray-600 block mb-1">수량</label><input type="number" value={qty} onChange={e=>setQty(e.target.value)} className="w-full px-2 py-1.5 border-2 border-gray-200 rounded text-xs font-bold"/></div>
      <div><label className="text-xs text-red-500 block mb-1">손절가</label><input type="number" value={stopPrice} onChange={e=>setStopPrice(e.target.value)} className="w-full px-2 py-1.5 border-2 border-red-200 rounded text-xs font-bold"/></div>
      <div><label className="text-xs text-green-600 block mb-1">목표가</label><input type="number" value={targetPrice} onChange={e=>setTargetPrice(e.target.value)} className="w-full px-2 py-1.5 border-2 border-green-200 rounded text-xs font-bold"/></div>
    </div>
    {bp>0&&q>0&&<div className="grid grid-cols-3 gap-2 text-center text-xs">
      <div className="bg-white rounded-lg p-2 border"><p className="text-gray-500">투자금</p><p className="font-bold text-base">{pfx}{totalCost.toLocaleString()}</p></div>
      {sp>0&&<div className="bg-red-50 rounded-lg p-2 border border-red-200"><p className="text-red-500 font-bold">손절 시 손실</p><p className="font-bold text-base text-red-600">{pfx}{Math.round(lossAmt).toLocaleString()}</p><p className="text-xs text-red-500">({lossPct}%)</p></div>}
      {tp>0&&<div className="bg-green-50 rounded-lg p-2 border border-green-200"><p className="text-green-600 font-bold">목표 시 수익</p><p className="font-bold text-base text-green-700">{pfx}{Math.round(gainAmt).toLocaleString()}</p><p className="text-xs text-green-600">(+{gainPct}%)</p></div>}
    </div>}
    {rr!=='-'&&<div className="mt-2 bg-white rounded-lg p-2 border flex justify-between items-center"><span className="text-xs text-gray-600">손익비 (수익÷손실)</span><span className={'text-sm font-bold '+rrColor}>1 : {rr} <span className="text-xs ml-1">({rrLabel})</span></span></div>}
    <p className="text-xs text-gray-600 mt-2 leading-relaxed">⚠️ 손익비 1:2 이상 권장 · 1:1 미만은 비추천 · 슬리피지·세금 미반영 · 실전은 더 불리할 수 있음</p>
  </div>
}

window.saveTrade=function(trade){
  var trades=JSON.parse(localStorage.getItem('tradeLog')||'[]');
  var t={
    ts:Date.now(),
    buyDate:trade.buyDate||new Date().toISOString().slice(0,10),

window.closeTrade=function(ts,sellPrice,sellMemo){
  var trades=window.getTrades();
  var idx=trades.findIndex(function(x){return x.ts===ts});
  if(idx<0)return false;
  var t=trades[idx];
  t.status='closed';
  t.sellDate=new Date().toISOString().slice(0,10);
  t.sellPrice=Number(sellPrice)||0;
  t.sellMemo=sellMemo||'';
  var d1=new Date(t.buyDate);
  var d2=new Date(t.sellDate);
  t.holdDays=Math.max(1,Math.round((d2-d1)/(24*3600*1000)));
  t.pnlPct=t.buyPrice>0?Number(((t.sellPrice-t.buyPrice)/t.buyPrice*100).toFixed(2)):0;
  t.pnlAmount=Math.round((t.sellPrice-t.buyPrice)*t.qty);
  trades[idx]=t;
  localStorage.setItem('tradeLog',JSON.stringify(trades));
  return true;
};

window.getTradeStats=function(inputArr){
  var src=inputArr||window.getTrades();
  var trades=src.filter(function(x){return x.status==='closed'});
  if(trades.length===0)return {total:0,wins:0,losses:0,winRate:0,avgPnl:0,maxWin:0,maxLoss:0,avgHold:0,byScore:{}};
  var wins=trades.filter(function(x){return x.pnlPct>0});
  var losses=trades.filter(function(x){return x.pnlPct<=0});
  var avgPnl=trades.reduce(function(s,x){return s+x.pnlPct},0)/trades.length;
  var maxWin=Math.max.apply(null,trades.map(function(x){return x.pnlPct}));
  var maxLoss=Math.min.apply(null,trades.map(function(x){return x.pnlPct}));
  var avgHold=trades.reduce(function(s,x){return s+x.holdDays},0)/trades.length;
  var byScore={};
  [['high',7,8],['mid',5,6],['low',0,4]].forEach(function(b){
    var label=b[0],lo=b[1],hi=b[2];
    var sub=trades.filter(function(x){
      var sc=parseInt(String(x.checklistScore).split('/')[0])||0;
      return sc>=lo&&sc<=hi;
    });
    if(sub.length>0){
      var w=sub.filter(function(x){return x.pnlPct>0}).length;
      byScore[label]={count:sub.length,winRate:Number((w/sub.length*100).toFixed(1)),avgPnl:Number((sub.reduce(function(s,x){return s+x.pnlPct},0)/sub.length).toFixed(2))};
    }
  });
  return {
    total:trades.length,
    wins:wins.length,
    losses:losses.length,
    winRate:Number((wins.length/trades.length*100).toFixed(1)),
    avgPnl:Number(avgPnl.toFixed(2)),
    maxWin:Number(maxWin.toFixed(2)),
    maxLoss:Number(maxLoss.toFixed(2)),
    avgHold:Number(avgHold.toFixed(1)),
                byScore:byScore
  };
};

window.analyzeQuarterTrend=function(quarters){
  if(!quarters||quarters.length<3)return{trend:'unknown',label:'데이터 부족',score:0,qoq:[],description:'분기 3개 미만'};
  var sorted=quarters.slice().sort(function(a,b){return (a.year*10+a.quarter)-(b.year*10+b.quarter);});
  var qoqList=[];
  for(var i=1;i<sorted.length;i++){
    var prev=sorted[i-1].revenue;
    var curr=sorted[i].revenue;
    if(!prev||prev<=0){qoqList.push(null);continue;}
    qoqList.push(Math.round(((curr-prev)/prev)*1000)/10);
  }
  var validQoQ=qoqList.filter(function(v){return v!==null;});
  if(validQoQ.length<2)return{trend:'unknown',label:'데이터 부족',score:0,qoq:qoqList,description:'유효 QoQ 2개 미만'};
  var lastQoQ=validQoQ[validQoQ.length-1];
  var allRising=true;var allFalling=true;
  for(var j=1;j<validQoQ.length;j++){
    if(validQoQ[j]<=validQoQ[j-1]+5)allRising=false;
    if(validQoQ[j]>=validQoQ[j-1]-5)allFalling=false;
  }
  var avgAbs=validQoQ.reduce(function(a,b){return a+Math.abs(b);},0)/validQoQ.length;
  var firstHalf=validQoQ.slice(0,Math.floor(validQoQ.length/2));
  var lastHalf=validQoQ.slice(Math.floor(validQoQ.length/2));
  var firstAvg=firstHalf.reduce(function(a,b){return a+b;},0)/firstHalf.length;
  var lastAvg=lastHalf.reduce(function(a,b){return a+b;},0)/lastHalf.length;
  var trend,label,score,desc;
  if(lastQoQ<-10){trend='collapse';label='💥 급감';score=-5;desc='최근 분기 매출 급감 (-10%↓)';}
  else if(allFalling&&lastQoQ<firstHalf[0]){trend='decelerating';label='📉 둔화';score=-3;desc='매 분기 성장률 둔화';}
  else if(allRising){trend='accelerating';label='🚀 폭발 가속';score=5;desc='매 분기 성장률 가속 (+5%p↑)';}
  else if(lastAvg>firstAvg+5&&validQoQ.every(function(v){return v>0;})){trend='gradual_up';label='📈 점진 가속';score=3;desc='후반 분기 성장률 증가';}
  else if(avgAbs<3){trend='stagnant';label='⏸️ 정체';score=0;desc='평균 QoQ 변동 3% 미만';}
  else if(validQoQ.every(function(v){return v>0;})){trend='stable';label='➡️ 안정 성장';score=1;desc='꾸준한 분기 성장';}
  else{trend='mixed';label='🔀 혼조';score=0;desc='상승·하락 혼재';}
  return{trend:trend,label:label,score:score,qoq:qoqList,firstAvg:Math.round(firstAvg*10)/10,lastAvg:Math.round(lastAvg*10)/10,description:desc};
};
window.calcVolumeMomentum=function(minutes){
  if(!minutes||minutes.length<200)return{score:0,label:'데이터 부족',ratio:null};
  var oneDayBars=234;
  var lookback=Math.min(minutes.length,oneDayBars*6);
  var seg=minutes.slice(-lookback);
  var recent=seg.slice(-oneDayBars);
  var prev=seg.slice(0,seg.length-oneDayBars);
  if(prev.length<oneDayBars)return{score:0,label:'데이터 부족',ratio:null};
  var recentVol=recent.reduce(function(a,b){return a+(b.volume||0);},0);
  var prevDays=prev.length/oneDayBars;
  var prevAvgVol=prev.reduce(function(a,b){return a+(b.volume||0);},0)/prevDays;
  if(prevAvgVol<=0)return{score:0,label:'데이터 부족',ratio:null};
  var ratio=Math.round((recentVol/prevAvgVol)*100);
  var score,label;
  if(ratio>=200){score=30;label='🔥 폭증';}
  else if(ratio>=150){score=24;label='📈 급증';}
  else if(ratio>=120){score=18;label='👍 증가';}
  else if(ratio>=80){score=13;label='➡️ 평균';}
  else if(ratio>=50){score=7;label='📉 감소';}
  else{score=3;label='💤 침체';}
  return{score:score,label:label,ratio:ratio};
};
window.calcPriceMomentum=function(minutes){

      fetchKrMinute(code).catch(()=>null),
      fetchStockNews(name).catch(()=>[]),
      fetchLsHoga(code).catch(()=>null)
    ]);

window.correlation=function(xs,ys){
  const n=xs.length;
  if(n<3)return null;
  const mx=xs.reduce((a,b)=>a+b,0)/n;
  const my=ys.reduce((a,b)=>a+b,0)/n;
  let num=0,dx=0,dy=0;
  for(let i=0;i<n;i++){const a=xs[i]-mx,b=ys[i]-my;num+=a*b;dx+=a*a;dy+=b*b;}
  const denom=Math.sqrt(dx*dy);
  return denom>0?Math.round(num/denom*1000)/1000:null;
};

function summarizeScript(text){
  if(!text||text.length<50)return {summary:text,sentences:[]};
  var clean=text.replace(/\[음악\]|\[박수\]|\[웃음\]/g,'').replace(/\s+/g,' ').trim();
  var sents=clean.split(/(?<=[.!?。])\s+|(?<=다)\s+(?=[가-힣])|(?<=요)\s+(?=[가-힣])/).filter(function(s){return s.trim().length>10});
  if(sents.length===0)sents=[clean];
  var keywords=['추천','매수','목표가','상승','하락','주목','유망','전망','실적','호재','악재','매도','상한가','반도체','이차전지','바이오','방산','AI','반등','조정'];
  var scored=sents.map(function(s,i){
    var score=0;
    keywords.forEach(function(k){if(s.indexOf(k)>=0)score+=2});
    var stocks=window.extractStockNames(s);
    score+=stocks.length*3;
    if(i===0)score+=1;
    if(i===sents.length-1)score+=1;
    return {text:s.trim(),score:score,idx:i};
  });
  var top=scored.filter(function(x){return x.score>0}).sort(function(a,b){return b.score-a.score}).slice(0,6).sort(function(a,b){return a.idx-b.idx});
  if(top.length===0)top=scored.slice(0,3);
  return {summary:top.map(function(x){return x.text}).join(' '),sentences:top.map(function(x){return x.text})};
}

          {(function(){var s=signal('영업이익',d3y.trend.opIncomeGrowth,true);return <div className={s.color+' flex justify-between'}><span>{s.ic} 영업이익 성장률</span><span className="font-bold">{s.text}</span></div>})()}
          {(function(){var s=signal('순이익',d3y.trend.netIncomeGrowth,true);return <div className={s.color+' flex justify-between'}><span>{s.ic} 순이익 성장률</span><span className="font-bold">{s.text}</span></div>})()}
          {(function(){var s=signal('부채',d3y.trend.debtRatioChange,false);return <div className={s.color+' flex justify-between'}><span>{s.ic} 부채비율 변화</span><span className="font-bold">{s.text}</span></div>})()}
        </div>
                <p className="text-xs text-purple-700 mt-3 leading-relaxed">💡 매출·이익이 꾸준히 증가하고 부채비율이 안정적이면 좋은 신호입니다. 단, 회사의 제품 경쟁력과 산업 환경은 직접 판단해야 합니다.</p>
      </div>}

    <div className="bg-white rounded-lg p-3 mt-3 border border-purple-200">

        </div>

      {showForm?<div className="space-y-3">

          <div><label className="text-xs text-gray-600">PBR (배)</label><input type="number" step="0.1" value={pbr} onChange={function(e){setPbr(e.target.value)}} placeholder="예: 1.5" className="w-full text-sm px-2 py-1 border rounded"/></div>

          </div>
          <textarea value={pMemo} onChange={function(e){setPMemo(e.target.value)}} placeholder="예: 메모리 반도체 점유율 1위, 브랜드 인지도 높음..." className="w-full text-xs px-2 py-1 border rounded mt-1" rows="2"/>
        </div>
        <div>
          <label className="text-xs text-gray-600 font-bold">동종업계 경쟁자 위협</label>
          <div className="flex gap-2 mt-1">
            {[1,2,3].map(function(v){return <label key={v} className={'flex-1 text-center text-xs py-1 rounded cursor-pointer border '+(cThreat===v?'bg-orange-100 border-orange-500 font-bold':'bg-white border-gray-300')}><input type="radio" name="ct" value={v} checked={cThreat===v} onChange={function(){setCThreat(v)}} className="hidden"/>{threatLabel[v]}</label>})}
          </div>
          <textarea value={cMemo} onChange={function(e){setCMemo(e.target.value)}} placeholder="예: SK하이닉스가 HBM에서 추격 중..." className="w-full text-xs px-2 py-1 border rounded mt-1" rows="2"/>
        </div>
        <div>
          <label className="text-xs text-gray-600 font-bold">한줄 결론</label>

        </div>
        <button onClick={handleSave} className="w-full py-2 bg-purple-500 text-white rounded font-bold hover:bg-purple-600">💾 저장</button>
      </div>:manual?<div className="text-xs space-y-1.5">

        </div>

        <div className="bg-orange-50 rounded p-2"><span className="text-gray-600">경쟁자 위협:</span> <b className={manual.competitorThreat===1?'text-green-700':manual.competitorThreat===3?'text-red-600':'text-gray-700'}>{threatLabel[manual.competitorThreat]||'-'}</b>{manual.competitorMemo&&<div className="text-gray-600 mt-0.5 italic">"{manual.competitorMemo}"</div>}</div>
        {manual.conclusion&&<div className="bg-yellow-50 rounded p-2 border border-yellow-200"><span className="text-gray-600">📝 결론:</span> <b className="text-gray-800">{manual.conclusion}</b></div>}

    </div>
  </div>;
}

function TradeStatsView(){
  var [trades,setTrades]=React.useState(window.getTrades());
  var [stats,setStats]=React.useState(window.getTradeStats());
    var [filter,setFilter]=React.useState('all');
  var [stockFilter,setStockFilter]=React.useState('all');
  function refresh(){setTrades(window.getTrades());setStats(window.getTradeStats());}
  function handleDelete(ts){
    if(!confirm('이 거래 기록을 삭제하시겠습니까?'))return;
    window.deleteTrade(ts);refresh();
  }
  function exportCsv(){
    var ts=window.getTrades();
    if(ts.length===0){alert('내보낼 거래 기록이 없습니다');return;}
    var header='매수일,종목,종목코드,매수가,수량,손절가,목표가,체크리스트,종합점수,손익비,매수메모,상태,매도일,매도가,보유일,손익률,손익금액,매도메모';
    var rows=ts.map(function(t){
      return [t.buyDate,t.name,t.code,t.buyPrice,t.qty,t.stopPrice,t.targetPrice,t.checklistScore,t.totalScore,t.rrRatio,'"'+(t.buyMemo||'').replace(/"/g,'""')+'"',t.status,t.sellDate,t.sellPrice,t.holdDays,t.pnlPct,t.pnlAmount,'"'+(t.sellMemo||'').replace(/"/g,'""')+'"'].join(',');
    });
    var csv='\uFEFF'+header+'\n'+rows.join('\n');
    var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download='trade_log_'+new Date().toISOString().slice(0,10)+'.csv';
    a.click();URL.revokeObjectURL(url);
  }
    var stockList=Array.from(new Set(trades.map(function(x){return x.name||'(이름없음)'}))).sort();
  var stockFiltered=stockFilter==='all'?trades:trades.filter(function(x){return (x.name||'(이름없음)')===stockFilter});
  var fStats=window.getTradeStats(stockFiltered);
  var holding=stockFiltered.filter(function(x){return x.status==='holding'});
  var closed=stockFiltered.filter(function(x){return x.status==='closed'});
  var displayed=filter==='holding'?holding:(filter==='closed'?closed:stockFiltered);
  displayed=displayed.slice().sort(function(a,b){return b.ts-a.ts});
    var winColor=fStats.winRate>=60?'text-red-600':(fStats.winRate>=40?'text-orange-500':'text-blue-600');
  var pnlColor=fStats.avgPnl>0?'text-red-600':(fStats.avgPnl<0?'text-blue-600':'text-gray-600');
  return <div className="space-y-4">
    <div className="bg-white rounded-2xl shadow p-5">
      <div className="flex justify-between items-center mb-3">
        <h2 className="text-lg font-bold">📊 거래 통계</h2>
        <button onClick={exportCsv} className="text-xs px-3 py-1.5 bg-green-500 text-white rounded hover:bg-green-600">📥 CSV 내보내기</button>
      </div>
      <p className="text-xs text-gray-500 mb-4">완료된 거래만 통계에 반영됩니다. 모의투자 1주일 후 적중률을 점검하세요.</p>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
                <div className="bg-gray-50 rounded-lg p-3 text-center"><p className="text-xs text-gray-500">총 거래</p><p className="text-2xl font-bold">{fStats.total}건</p><p className="text-xs text-gray-400">보유 {holding.length} · 완료 {closed.length}</p></div>
        <div className="bg-gray-50 rounded-lg p-3 text-center"><p className="text-xs text-gray-500">승률</p><p className={'text-2xl font-bold '+winColor}>{fStats.winRate}%</p><p className="text-xs text-gray-400">승 {fStats.wins} · 패 {fStats.losses}</p></div>
        <div className="bg-gray-50 rounded-lg p-3 text-center"><p className="text-xs text-gray-500">평균 손익률</p><p className={'text-2xl font-bold '+pnlColor}>{fStats.avgPnl>0?'+':''}{fStats.avgPnl}%</p><p className="text-xs text-gray-400">평균 보유 {fStats.avgHold}일</p></div>
        <div className="bg-gray-50 rounded-lg p-3 text-center"><p className="text-xs text-gray-500">최대 이익/손실</p><p className="text-sm font-bold"><span className="text-red-600">+{fStats.maxWin}%</span> / <span className="text-blue-600">{fStats.maxLoss}%</span></p></div>
      </div>
            {Object.keys(fStats.byScore).length>0&&<div className="bg-yellow-50 border border-yellow-200 rounded-lg p-3 mb-4">
        <p className="text-sm font-bold text-yellow-800 mb-2">📋 체크리스트 점수별 적중률</p>
        <div className="space-y-1">
          {fStats.byScore.high&&<div className="flex justify-between text-xs"><span>7~8점 (높음)</span><span><b>{fStats.byScore.high.count}건</b> · 승률 <b className={fStats.byScore.high.winRate>=60?'text-red-600':'text-gray-700'}>{fStats.byScore.high.winRate}%</b> · 평균 {fStats.byScore.high.avgPnl>0?'+':''}{fStats.byScore.high.avgPnl}%</span></div>}
          {fStats.byScore.mid&&<div className="flex justify-between text-xs"><span>5~6점 (중간)</span><span><b>{fStats.byScore.mid.count}건</b> · 승률 <b>{fStats.byScore.mid.winRate}%</b> · 평균 {fStats.byScore.mid.avgPnl>0?'+':''}{fStats.byScore.mid.avgPnl}%</span></div>}
          {fStats.byScore.low&&<div className="flex justify-between text-xs"><span>0~4점 (낮음)</span><span><b>{fStats.byScore.low.count}건</b> · 승률 <b className={fStats.byScore.low.winRate<40?'text-blue-600':'text-gray-700'}>{fStats.byScore.low.winRate}%</b> · 평균 {fStats.byScore.low.avgPnl>0?'+':''}{fStats.byScore.low.avgPnl}%</span></div>}
        </div>
        <p className="text-xs text-yellow-700 mt-2">※ 7점 이상 승률이 5점대보다 확실히 높으면 체크리스트가 신뢰할 만하다는 신호입니다.</p>
      </div>}
            {stockList.length>0&&<div className="mb-3 flex items-center gap-2 flex-wrap"><label className="text-xs text-gray-600 font-bold">🔍 종목 필터:</label><select value={stockFilter} onChange={function(e){setStockFilter(e.target.value)}} className="text-xs px-2 py-1 border rounded bg-white"><option value="all">전체 종목 ({trades.length}건)</option>{stockList.map(function(n){var cnt=trades.filter(function(x){return (x.name||'(이름없음)')===n}).length;return <option key={n} value={n}>{n} ({cnt}건)</option>;})}</select>{stockFilter!=='all'&&<button onClick={function(){setStockFilter('all')}} className="text-xs px-2 py-1 bg-gray-200 rounded hover:bg-gray-300">✕ 필터 해제</button>}</div>}
      <div className="flex gap-1 mb-3">
        <button onClick={function(){setFilter('all')}} className={'px-3 py-1 rounded text-xs '+(filter==='all'?'bg-blue-500 text-white':'bg-gray-100 text-gray-600')}>전체 ({stockFiltered.length})</button>
        <button onClick={function(){setFilter('holding')}} className={'px-3 py-1 rounded text-xs '+(filter==='holding'?'bg-blue-500 text-white':'bg-gray-100 text-gray-600')}>보유 중 ({holding.length})</button>
        <button onClick={function(){setFilter('closed')}} className={'px-3 py-1 rounded text-xs '+(filter==='closed'?'bg-blue-500 text-white':'bg-gray-100 text-gray-600')}>완료 ({closed.length})</button>
      </div>
      {displayed.length===0?<p className="text-sm text-gray-500 text-center py-8">표시할 거래 기록이 없습니다.</p>:<div className="space-y-2 max-h-96 overflow-y-auto">
        {displayed.map(function(t){
          var color=t.status==='closed'?(t.pnlPct>0?'border-red-200 bg-red-50':(t.pnlPct<0?'border-blue-200 bg-blue-50':'border-gray-200 bg-gray-50')):'border-gray-200 bg-white';
          var pColor=t.pnlPct>0?'text-red-600':(t.pnlPct<0?'text-blue-600':'text-gray-600');
          return <div key={t.ts} className={'p-3 rounded-lg border-2 '+color}>

function playAlertSound(type){
  try{
    var ctx=new(window.AudioContext||window.webkitAudioContext)();
    var osc=ctx.createOscillator();
    var gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    if(type==='buy'){osc.frequency.value=880;gain.gain.value=0.3;}
    else if(type==='sell'){osc.frequency.value=440;gain.gain.value=0.3;}
    else{osc.frequency.value=660;gain.gain.value=0.2;}
    osc.start();osc.stop(ctx.currentTime+0.3);
    setTimeout(function(){
      var osc2=ctx.createOscillator();var gain2=ctx.createGain();
      osc2.connect(gain2);gain2.connect(ctx.destination);
      osc2.frequency.value=type==='buy'?1100:type==='sell'?330:660;
      gain2.gain.value=0.3;osc2.start();osc2.stop(ctx.currentTime+0.3);
    },350);
  }catch(e){}
}

async function fetchStockNews(query){
  if(!query) return [];
  try{
    var url='http://localhost:3000/news?q='+encodeURIComponent(query);
    var res=await fetch(url,{signal:AbortSignal.timeout(15000)});
    if(!res.ok) throw new Error('서버 응답 오류: '+res.status);
    var data=await res.json();
    if(!data.success) return [];
    return (data.items||[]).map(function(it){
      return {title:it.title||'',description:it.source||'',body:'',link:it.link||'',source:it.source||'',date:it.date||''};
    });
  }catch(err){
    console.error('[fetchStockNews] 에러:',err.message);
    if(!window._newsServerWarned){
      window._newsServerWarned=true;
      console.warn('💡 뉴스 서버가 꺼져 있을 수 있습니다. cmd에서 "node server.js" 실행 확인.');
    }
    return [];
  }

/* ============================================================
   ⭐ Phase 1: 모든 백테스트를 honestBacktestV2로 통일
   - 룩어헤드 편향 완전 제거
   - 다음날 시초가 체결
   - 거래세 0.23% (KOSPI), 수수료 0.015%, 슬리피지 0.3%
   ⚠️ "예상 실전 수익률 ×0.65" 표시 제거 (학술 근거 없음)
   ============================================================ */

function runBacktest(data,params){
  if(!data||data.length<30)return{error:'데이터 부족(최소30일)'};
  params=params||{};
  
  // 통합 전략: MA5/MA20 골든크로스 + RSI 필터 + 거래량 필터
  var unifiedStrategy=function(closes,highs,lows,daily,i){
    if(closes.length<35)return null;
    var len=closes.length;
    
    // MA 계산
    var ma5=0,ma20=0;
    for(var j=0;j<5;j++)ma5+=closes[len-1-j];ma5/=5;
    for(var j=0;j<20;j++)ma20+=closes[len-1-j];ma20/=20;
    var pma5=0,pma20=0;
    for(var j=0;j<5;j++)pma5+=closes[len-2-j];pma5/=5;
    for(var j=0;j<20;j++)pma20+=closes[len-2-j];pma20/=20;
    
    // RSI 계산
    var gains=0,losses=0;
    for(var r=len-14;r<len;r++){var dif=closes[r]-closes[r-1];if(dif>0)gains+=dif;else losses-=dif;}
    var rs=losses===0?100:gains/losses;
    var rsi=100-100/(1+rs);
    
    // 거래량 필터
    var volRatio=1;
    if(daily&&daily.length>=21){
      var avgVol=0;
      for(var v=len-21;v<len-1;v++)avgVol+=daily[v].volume;
      avgVol/=20;
      if(avgVol>0)volRatio=daily[len-1].volume/avgVol;
    }
    
    // 매수: 골든크로스 + RSI 70 미만 + 거래량 정상
    if(pma5<=pma20 && ma5>ma20 && rsi<70 && volRatio>=0.7)return 'buy';
    // 매수: RSI 과매도 반등 + 20일선 위
    if(rsi<=30 && closes[len-1]>ma20)return 'buy';
    // 매도: 데드크로스
    if(pma5>=pma20 && ma5<ma20)return 'sell';
    // 매도: RSI 과열
    if(rsi>=78)return 'sell';
    return null;
  };
  
  var result=honestBacktestV2(data,unifiedStrategy,{
    fee:params.fee||0.00015,
    tax:params.tax||0.0023,
    slip:params.slip||0.003
  });
  
  if(!result)return{error:'백테스트 실행 실패'};
  
  // UI 호환을 위한 trades 포맷 변환
  var formattedTrades=[];
  for(var ti=0;ti<result.trades.length;ti++){
    var t=result.trades[ti];
    if(t.type==='sell'){
      var prevBuy=null;
      for(var pi=ti-1;pi>=0;pi--){
        if(result.trades[pi].type==='buy'){prevBuy=result.trades[pi];break;}
      }
      if(prevBuy){
        formattedTrades.push({
          buyDate:prevBuy.execDate,
          sellDate:t.execDate,
          buyPrice:prevBuy.execPrice,
          sellPrice:t.execPrice,
          shares:prevBuy.shares,
          pnl:t.pnl,
          pnlPct:t.pnlPct,
          reason:t.pnlPct>0?'전략매도(+'+t.pnlPct+'%)':'전략매도('+t.pnlPct+'%)'
        });
      }
    }
  }
  
  return {
    trades:formattedTrades,
    totalTrades:formattedTrades.length,
    wins:result.wins,
    losses:result.losses,
    winRate:result.winRate,
    totalPnl:result.finalCapital-10000000,
    totalReturn:result.totalReturn,
    buyAndHold:result.buyAndHold,
    alpha:result.alpha,
    sharpe:result.sharpe,
    maxDrawdown:result.maxDrawdown,
    finalCapital:result.finalCapital,
    avgPnl:formattedTrades.length>0?Math.round((result.finalCapital-10000000)/formattedTrades.length):0,
    isHonest:true,
    executionMethod:'다음날 시초가 체결',
    feeInfo:'수수료 '+((params.fee||0.00015)*100).toFixed(3)+'% + 거래세 '+((params.tax||0.0023)*100).toFixed(2)+'% + 슬리피지 '+((params.slip||0.003)*100).toFixed(1)+'%'
  };
}

return ts.map(function(t,i){return {date:new Date(t*1000).toISOString().slice(0,10),open:q.open[i],high:q.high[i],low:q.low[i],close:q.close[i],volume:q.volume[i]};}).filter(function(d){return d.close&&d.open;});

});
}
next();
}

function TrailingStop({holdings,setHoldings}){
  var [trailing,setTrailing]=useState({});
  var [tsActive,setTsActive]=useState(false);
  var [tsPercent,setTsPercent]=useState(3);
  var timerRef=useRef(null);
  function updateTrailing(){
    var updated=[...holdings];
    var newTrail={...trailing};
    var idx=0;
    function next(){
      if(idx>=updated.length){setHoldings([...updated]);setTrailing({...newTrail});return}
      var h=updated[idx];idx++;
      var isUS=/^[A-Z]{1,5}$/.test(h.symbol)&&!getCode(h.symbol);
      (isUS?fetchUsD(h.symbol):fetchKrD(h.symbol)).then(function(d){
        if(d&&d.length>0){
          var price=d[d.length-1].close;
          h.currentPrice=price;
          var key=h.symbol;
          if(!newTrail[key]){newTrail[key]={highPrice:price,stopPrice:Math.round(price*(1-tsPercent/100))}}
          else{
            if(price>newTrail[key].highPrice){
              newTrail[key].highPrice=price;
              newTrail[key].stopPrice=Math.round(price*(1-tsPercent/100));
            }
            if(price<=newTrail[key].stopPrice){
              playAlertSound('sell');
              showToast('🚨 트레일링 스탑! '+h.symbol+' 현재가 '+price.toLocaleString()+'원이 스탑가 '+newTrail[key].stopPrice.toLocaleString()+'원 이하!');
            }
          }
        }
        setTimeout(next,300);
      }).catch(function(){setTimeout(next,200)});
    }
    next();
  }
  useEffect(function(){
    if(tsActive){
      updateTrailing();
      timerRef.current=setInterval(updateTrailing,60000);
    }else{
      if(timerRef.current)clearInterval(timerRef.current);
    }
    return function(){if(timerRef.current)clearInterval(timerRef.current)};
  },[tsActive,tsPercent]);
  if(!holdings||holdings.length===0)return null;
  return <div className="bg-white rounded-2xl shadow border-2 border-orange-300 p-4 mb-2">
    <div className="flex justify-between items-center mb-2">
      <h3 className="font-bold text-sm">🛡️ 트레일링 스탑</h3>
      <div className="flex items-center gap-2">
        <span className="text-xs text-gray-500">하락폭:</span>
        <select className="text-xs border rounded px-2 py-1" value={tsPercent} onChange={function(e){setTsPercent(Number(e.target.value));setTrailing({})}}>
          <option value={2}>2%</option>
          <option value={3}>3%</option>
          <option value={5}>5%</option>
          <option value={7}>7%</option>
          <option value={10}>10%</option>
        </select>
        <button className={'px-3 py-1.5 rounded-lg text-xs font-bold '+(tsActive?'bg-red-500 text-white animate-pulse':'bg-orange-500 text-white')} onClick={function(){setTsActive(!tsActive)}}>{tsActive?'⏹ 스탑 해제':'🛡️ 스탑 시작'}</button>
      </div>
    </div>
    <p className="text-xs text-gray-500 mb-2">고점 대비 {tsPercent}% 하락 시 매도 알림. 주가 상승 시 손절가도 자동 상향.</p>
    {Object.keys(trailing).length>0&&<div className="space-y-1">
      {holdings.map(function(h){
        var t=trailing[h.symbol];
        if(!t)return null;
        var pnl=h.currentPrice&&t.stopPrice?+((h.currentPrice/t.stopPrice-1)*100).toFixed(1):0;
        return <div key={h.symbol} className="flex justify-between items-center bg-orange-50 rounded-lg px-3 py-1.5 text-xs">
          <span className="font-bold">{h.symbol}</span>
          <span>현재: {(h.currentPrice||0).toLocaleString()}원</span>
          <span>고점: {t.highPrice.toLocaleString()}원</span>
          <span className="text-orange-600 font-bold">스탑: {t.stopPrice.toLocaleString()}원</span>
          <span className={pnl>0?'text-green-600':'text-red-500'}>여유: {pnl>0?'+':''}{pnl}%</span>
        </div>
      })}
    </div>}
  </div>
}


function SignalMonitor({watchlist,holdings,market}){
  var [monitoring,setMonitoring]=useState(false);
  var [interval2,setInterval2]=useState(60);
  var [signals,setSignals]=useState([]);
  var [lastCheck,setLastCheck]=useState('');
  var [countdown,setCountdown]=useState(0);
  var timerRef=useRef(null);
  var countRef=useRef(null);
  var prevSignals=useRef({});

  function getTargets(){
    var targets=[];
    var seen={};
    (watchlist||[]).forEach(function(w){if(!seen[w.symbol]){seen[w.symbol]=true;targets.push({symbol:w.symbol,source:'관심'})}});
    (holdings||[]).forEach(function(h){if(!seen[h.symbol]){seen[h.symbol]=true;targets.push({symbol:h.symbol,source:'보유'})}});
    return targets;
  }

  function checkSignals(){
    var targets=getTargets();
    if(targets.length===0){setSignals(function(p){return[{time:new Date().toLocaleTimeString('ko-KR'),symbol:'-',msg:'감시 대상 없음. 관심종목이나 보유종목을 등록하세요.',type:'info'}].concat(p).slice(0,50)});return}
    var idx=0;
    function next(){
      if(idx>=targets.length){setLastCheck(new Date().toLocaleTimeString('ko-KR'));setCountdown(interval2);return}
      var t=targets[idx];idx++;
      var isUS=/^[A-Z]{1,5}$/.test(t.symbol)&&!getCode(t.symbol);
      (isUS?fetchUsD(t.symbol):fetchKrD(t.symbol)).then(function(d){
        if(!d||d.length<12){setTimeout(next,200);return}
        var patterns=detectCandlePatterns(d);
        var now=new Date().toLocaleTimeString('ko-KR');
        var prevKey=t.symbol;
        var prevList=prevSignals.current[prevKey]||[];
        var newSigs=[];

        patterns.forEach(function(p){
          var exists=prevList.some(function(pp){return pp.name===p.name});
          if(!exists){
            var emoji=p.type==='buy'?'🟢':'🔴';
            var urgent=p.name.indexOf('강력')!==-1;
            newSigs.push({time:now,symbol:t.symbol+'('+t.source+')',msg:emoji+(urgent?' 🔔 ':' ')+p.name+' '+p.strength+'% - '+p.desc,type:p.type,urgent:urgent,action:p.action});
            if(urgent){playAlertSound(p.type);if('Notification' in window&&Notification.permission==='granted'){try{new Notification(t.symbol+' '+p.name,{body:p.desc+'\n'+p.action,icon:'📊'})}catch(e){}}}else if(p.strength>=80){playAlertSound(p.type);}
          }
        });

        if(newSigs.length>0){
          setSignals(function(prev){return newSigs.concat(prev).slice(0,100)});
          prevSignals.current[prevKey]=patterns;
        }else if(!prevSignals.current[prevKey]){
          prevSignals.current[prevKey]=patterns;
          if(patterns.length>0){
            patterns.forEach(function(p){
              var emoji=p.type==='buy'?'🟢':'🔴';
              newSigs.push({time:now,symbol:t.symbol+'('+t.source+')',msg:emoji+' '+p.name+' '+p.strength+'%',type:p.type,urgent:false,action:p.action});
            });
            setSignals(function(prev){return newSigs.concat(prev).slice(0,100)});
          }
        }
        setTimeout(next,300);
      }).catch(function(){setTimeout(next,200)});
    }
    next();
  }

  useEffect(function(){
    if(monitoring){
      if('Notification' in window&&Notification.permission==='default'){Notification.requestPermission()}
      checkSignals();
      timerRef.current=setInterval(checkSignals,interval2*1000);
      countRef.current=setInterval(function(){setCountdown(function(c){return c>0?c-1:0})},1000);
    }else{
      if(timerRef.current)clearInterval(timerRef.current);
      if(countRef.current)clearInterval(countRef.current);
      setCountdown(0);
    }
    return function(){if(timerRef.current)clearInterval(timerRef.current);if(countRef.current)clearInterval(countRef.current)};
  },[monitoring,interval2]);

  return <div className="bg-white rounded-2xl shadow-lg border-2 border-yellow-300 p-4">
    <div className="flex justify-between items-center mb-3">
      <h3 className="font-bold text-sm">📡 실시간 신호 감시</h3>
      <div className="flex items-center gap-2">
        <select className="text-xs border rounded px-2 py-1" value={interval2} onChange={function(e){setInterval2(Number(e.target.value))}}>
          <option value={60}>1분</option>
          <option value={300}>5분</option>
          <option value={600}>10분</option>
        </select>
        <button className={'px-3 py-1.5 rounded-lg text-xs font-bold '+(monitoring?'bg-red-500 text-white animate-pulse':'bg-green-500 text-white')} onClick={function(){setMonitoring(!monitoring)}}>{monitoring?'⏹ 감시 중단':'▶ 감시 시작'}</button>
      </div>
    </div>
    {monitoring&&<div className="flex items-center gap-2 mb-2">
      <div className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
      <span className="text-xs text-gray-500">감시 중 | 대상: {getTargets().length}종목 | 다음 체크: {countdown}초 | 최종: {lastCheck||'-'}</span>
    </div>}
    {signals.length===0?<p className="text-xs text-gray-400 text-center py-4">감시를 시작하면 매수/매도 신호가 여기에 표시됩니다</p>:
    <div className="max-h-64 overflow-y-auto space-y-1">
      {signals.map(function(s,i){
        return <div key={i} className={'rounded-lg px-3 py-2 text-xs border-l-4 '+(s.urgent?'bg-yellow-50 border-yellow-500 font-bold':s.type==='buy'?'bg-green-50 border-green-400':s.type==='sell'?'bg-red-50 border-red-400':'bg-gray-50 border-gray-300')}>
          <div className="flex justify-between">
            <span><b>{s.symbol}</b> {s.msg}</span>
            <span className="text-gray-400 ml-2 whitespace-nowrap">{s.time}</span>
          </div>
          {s.action&&<p className="text-gray-500 mt-0.5">🎯 {s.action}</p>}
        </div>
      })}
    </div>}
    {signals.length>0&&<button className="text-xs text-gray-400 mt-2 hover:text-gray-600" onClick={function(){setSignals([]);prevSignals.current={}}}>기록 초기화</button>}
  </div>
}

<div className="bg-white rounded-2xl p-4 shadow-lg border border-orange-200">
          <p className="text-sm font-bold text-orange-700 mb-2">📌 주식 투자 종합 가이드</p>
          <div className="space-y-3 text-xs text-gray-700"><div className="bg-blue-50 rounded-xl p-3"><p className="font-bold text-blue-700 mb-2">📖 용어 쉽게 이해하기</p><div className="grid grid-cols-2 gap-2"><div><p>• <b>RSI</b> = 과열 온도계 (70↑ 뜨거움, 30↓ 차가움)</p><p>• <b>MACD</b> = 추세 방향 나침반 (위로↑매수, 아래↓매도)</p><p>• <b>골든크로스</b> = 단기선이 장기선을 위로 뚫음 (좋은 신호)</p><p>• <b>데드크로스</b> = 단기선이 장기선 아래로 (나쁜 신호)</p></div><div><p>• <b>POC</b> = 가장 많이 거래된 가격 (사람들이 적정하다고 본 가격)</p><p>• <b>VA(밸류에어리어)</b> = 거래의 70%가 일어난 가격 구간</p><p>• <b>VWAP</b> = 거래량 기준 평균가격 (기관 매매 기준선)</p><p>• <b>트레일링 스톱</b> = 수익 보호 장치 (최고가에서 일정% 떨어지면 자동 매도)</p></div></div></div><div className="grid grid-cols-2 gap-3"><div className="bg-green-50 rounded-xl p-3"><p className="font-bold text-green-700 mb-1">✅ 초보자 추천 설정</p><p>• 전일상승률: <b>5%</b> (너무 높으면 위험)</p><p>• 손절기준: <b>-2~3%</b> (이만큼 떨어지면 무조건 팔기)</p><p>• 목표수익: <b>3~5%</b> (욕심내지 말고 여기서 팔기)</p><p>• 투자금: 전체의 <b>10% 이내</b>만 사용</p></div><div className="bg-red-50 rounded-xl p-3"><p className="font-bold text-red-700 mb-1">🚫 절대 하지 말아야 할 것</p><p>• RSI 80↑일 때 사지 마세요 (이미 너무 올랐어요)</p><p>• 윗꼬리 3%↑ 종목 피하기 (매도세가 강해요)</p><p>• 손절가 정했으면 <b>절대 변경 금지</b></p><p>• "더 오르겠지" 생각 금물!</p></div></div><div className="bg-purple-50 rounded-xl p-3"><p className="font-bold text-purple-700 mb-2">🔍 이 앱의 분석 도구 활용법</p><p>• <b>📊 볼륨 프로파일</b> → POC 근처에서 사면 유리 (많은 사람이 적정하다고 본 가격)</p><p>• <b>🔗 섹터 분석</b> → 내 종목이 속한 업종의 선행지표를 먼저 확인하세요</p><p>• <b>🏦 수급 조회</b> → 외국인+기관 동반매수 = 강한 상승 신호, 동반매도 = 위험</p><p>• <b>📰 뉴스 감성</b> → 부정 뉴스가 3개 이상이면 매수 보류</p><p>• <b>📊 분봉 조회</b> → VWAP 위에 있으면 매수세 우위, 아래면 매도세 우위</p><p>• <b>🔍 매수 종목 발굴</b> → A등급만 매매, B등급은 관망, C·D는 무시</p><p>• <b>📤 매도 타이밍</b> → 긴급도 50↑이면 즉시 매도 검토</p></div><div className="bg-amber-50 rounded-xl p-3"><p className="font-bold text-amber-700 mb-2">💰 매수 타이밍 (언제 살까?)</p><p>• <b>1순위:</b> MACD 골든크로스 + 거래량 1.5배↑ + 외국인 매수 = 최고의 매수 시점</p><p>• <b>2순위:</b> RSI 30~40 구간 + 5일선 위 회복 = 반등 초기 진입</p><p>• <b>3순위:</b> POC(최다거래가) 부근까지 하락 후 반등 시작 = 지지 확인 매수</p><p>• <b>피해야 할 때:</b> RSI 70↑, MACD 데드크로스, 외국인+기관 동반매도</p></div><div className="bg-rose-50 rounded-xl p-3"><p className="font-bold text-rose-700 mb-2">📤 매도 타이밍 (언제 팔까?)</p><p>• <b>익절(수익 실현):</b> 목표가 도달 시 50% 매도, 나머지는 트레일링 스톱</p><p>• <b>손절(손실 차단):</b> -3% 도달 시 전량 매도 (고민하지 마세요!)</p><p>• <b>위험 신호:</b> RSI 80↑ + MACD 데드크로스 = 즉시 매도</p><p>• <b>수급 악화:</b> 외국인+기관 3일 연속 매도 = 부분 매도 검토</p><p>• <b>트레일링 스톱:</b> 최고가 대비 -7~10% 하락 시 자동 매도 설정</p></div><div className="bg-sky-50 rounded-xl p-3"><p className="font-bold text-sky-700 mb-2">⏰ 시간대별 매매 전략</p><p>• <b>9:00~9:30</b> → 변동성 폭발! 초보자는 절대 매매 금지, 구경만 하세요</p><p>• <b>9:30~10:00</b> → 방향이 정해지는 시간. 관망하며 준비</p><p>• <b>10:00~11:00</b> → 가장 안정적인 매매 시간 (초보자 추천!)</p><p>• <b>11:00~13:00</b> → 점심시간 거래량 감소. 큰 매매 피하기</p><p>• <b>14:00~15:00</b> → 종가 매매 (다음날 갭상승을 노리는 전략)</p><p>• <b>15:20~15:30</b> → 동시호가. 초보자 매매 금지</p></div><div className="bg-gray-50 rounded-xl p-3"><p className="font-bold text-gray-700 mb-2">🎯 초보자 실전 체크리스트</p><p>• ☐ 모의투자로 <b>최소 1~2개월</b> 연습했나요?</p><p>• ☐ 오늘 매매할 종목의 <b>뉴스 감성</b>을 확인했나요?</p><p>• ☐ <b>외국인/기관 수급</b>을 확인했나요?</p><p>• ☐ <b>매수가·손절가·목표가</b>를 미리 정했나요?</p><p>• ☐ 투자금은 전체의 <b>10% 이내</b>인가요?</p><p>• ☐ 하루 <b>1~2종목</b>만 매매하기로 했나요?</p><p>• ☐ "잃어도 괜찮은 돈"으로만 투자하고 있나요?</p></div></div>

        </div>
        <div className="bg-white rounded-2xl p-4 shadow-lg">
          <h3 className="text-sm font-bold mb-3">⚙️ 스캔 설정</h3>
          <div className="flex flex-wrap gap-2 mb-3">
            {[{k:'rise',n:'📈 전일급등',d:'전일 상승률 기준'},{k:'pullback',n:'📉 눌림목',d:'급등 후 5일선 눌림'},{k:'volume',n:'🔥 거래량폭발',d:'거래량 300%↑'},{k:'golden',n:'✨ 골든크로스',d:'5일선>20일선 돌파'},{k:'gap',n:'⬆️ 갭상승',d:'시가>전일종가 2%↑'}].map(m=>
              <button key={m.k} onClick={()=>setDantaModes(p=>({...p,[m.k]:!p[m.k]}))} className={'px-3 py-2 rounded-xl text-xs font-bold border-2 '+(dantaModes[m.k]?'bg-red-500 text-white border-red-500':'bg-white text-gray-600 border-gray-300')} title={m.d}>{m.n}</button>)}
          </div>

          <div className="grid grid-cols-3 gap-3">
            <div><label className="text-xs text-gray-500 block mb-1">전일상승률(%)</label><input type="number" value={dantaRise} onChange={e=>setDantaRise(Number(e.target.value))} className="w-full bg-gray-100 rounded-xl px-2 py-2 text-sm border border-gray-200"/></div>
            <div><label className="text-xs text-gray-500 block mb-1">손절기준(%)</label><input type="number" value={dantaStop} onChange={e=>setDantaStop(Number(e.target.value))} className="w-full bg-gray-100 rounded-xl px-2 py-2 text-sm border border-gray-200"/></div>
            <div><label className="text-xs text-gray-500 block mb-1">목표수익(%)</label><input type="number" value={dantaTarget} onChange={e=>setDantaTarget(Number(e.target.value))} className="w-full bg-gray-100 rounded-xl px-2 py-2 text-sm border border-gray-200"/></div></div>
          <button className={'mt-3 w-full py-3 rounded-2xl font-bold text-sm '+(dantaLoading?'bg-gray-300 text-gray-500':'bg-gradient-to-r from-red-500 to-orange-500 text-white shadow-lg')} disabled={dantaLoading} onClick={()=>{
            setDantaLoading(true);setDantaResults([]);var allStocks=Object.keys(KR_CODE).filter(k=>!k.includes('우')&&!k.includes('KODEX')&&!k.includes('TIGER'));
            setDantaProg({cur:0,total:allStocks.length,name:''});var found=[],idx=0;
            function next(){if(idx>=allStocks.length){setDantaLoading(false);found.sort((a,b)=>b.hitCount-a.hitCount||(b.score-a.score));setDantaResults([...found]);showToast('단타 스캔 완료! '+found.length+'개 후보');return}
              var sym=allStocks[idx];idx++;setDantaProg({cur:idx,total:allStocks.length,name:sym});
              fetchKrD(sym).then(d=>{if(!d||d.length<3){setTimeout(next,100);return}
                var today=d[d.length-1],yest=d[d.length-2],db=d[d.length-3];
                var cr=((today.close-yest.close)/yest.close*100);var pr=((yest.close-db.close)/db.close*100);
                var amtB=Math.round(today.close*today.volume/1e8);
                var ma5=d.length>=5?(d.slice(-5).reduce((a,x)=>a+x.close,0)/5):today.close;
                 var hitRise=dantaModes.rise&&(pr>=dantaRise||cr>=15)&&amtB>=500;
                var ma20c=d.length>=20?(d.slice(-20).reduce((a2,x2)=>a2+x2.close,0)/20):today.close;
                var pma5c=d.length>=6?(d.slice(-6,-1).reduce((a2,x2)=>a2+x2.close,0)/5):0;
                var pma20c=d.length>=21?(d.slice(-21,-1).reduce((a2,x2)=>a2+x2.close,0)/20):0;
                var hitPull=dantaModes.pullback&&d.length>=10&&(function(){var mx=0;for(var pi=d.length-10;pi<d.length-2;pi++){var rr=((d[pi].close-d[pi-1].close)/d[pi-1].close*100);if(rr>mx)mx=rr}return mx>=5&&today.close<=ma5*1.02&&today.close>=ma5*0.97&&today.close>ma20c})();
                var hitVol=dantaModes.volume&&d.length>=6&&(function(){var av=0;for(var vi2=d.length-6;vi2<d.length-1;vi2++)av+=d[vi2].volume;av/=5;return av>0&&today.volume/av>=3})();
                var hitGolden=dantaModes.golden&&pma5c>0&&pma20c>0&&pma5c<=pma20c&&ma5>ma20c;
                var hitGap=dantaModes.gap&&today.open>yest.close*1.02&&amtB>=300;
                var hitCount=(hitRise?1:0)+(hitPull?1:0)+(hitVol?1:0)+(hitGolden?1:0)+(hitGap?1:0);
                if(hitCount>=1){
                  var ma20=d.length>=20?(d.slice(-20).reduce((a,x)=>a+x.close,0)/20):today.close;
                  var rsi=null;if(d.length>=15){var gains=0,losses=0;for(var ri=d.length-14;ri<d.length;ri++){var dif=d[ri].close-d[ri-1].close;if(dif>0)gains+=dif;else losses-=dif}var rs=losses===0?100:gains/losses;rsi=Math.round(100-100/(1+rs))}
                  var volRatio=0;if(d.length>=6){var avgV=0;for(var vi=d.length-6;vi<d.length-1;vi++)avgV+=d[vi].volume;avgV/=5;volRatio=avgV>0?Math.round(today.volume/avgV*100):0}
                  var bodyPct=today.open>0?+((Math.abs(today.close-today.open)/today.open)*100).toFixed(1):0;
                  var upperTail=today.open>0?+((today.high-Math.max(today.open,today.close))/today.open*100).toFixed(1):0;
                  var lowerTail=today.open>0?+((Math.min(today.open,today.close)-today.low)/today.open*100).toFixed(1):0;
                  var candle=today.close>=today.open?'양봉':'음봉';
                  if(bodyPct<0.3&&upperTail>0.5&&lowerTail>0.5)candle='도지';
                  else if(lowerTail>bodyPct*2&&upperTail<bodyPct*0.5)candle='망치형(반등)';
                  else if(upperTail>bodyPct*2&&lowerTail<bodyPct*0.5)candle='유성형(하락)';
                  var gapPct=+((today.open-yest.close)/yest.close*100).toFixed(1);
                  var gapType=gapPct>=2?'갭상승':gapPct<=-2?'갭하락':'보통';
                  var macdSig='';if(d.length>=30){var m=calcMACD(d.map(x=>x.close));if(m){if(m.crossover)macdSig='골든크로스';else if(m.crossunder)macdSig='데드크로스';else if(m.histogram>0)macdSig='매수우위';else macdSig='매도우위'}}
                  var score=0;
                  if(today.close>ma5)score+=15;if(today.close>ma20)score+=10;if(ma5>ma20)score+=10;
                  if(rsi&&rsi>=40&&rsi<=70)score+=10;if(rsi&&rsi<30)score+=5;if(rsi&&rsi>80)score-=15;
                  if(volRatio>=200)score+=15;if(volRatio>=300)score+=5;
                  if(candle==='양봉')score+=5;if(candle==='망치형(반등)')score+=10;if(candle==='유성형(하락)')score-=10;if(candle==='도지')score-=5;
                  if(gapType==='갭상승'&&today.close>today.open)score+=10;if(gapType==='갭하락')score-=10;
                  if(upperTail>3)score-=10;if(macdSig==='골든크로스')score+=10;if(macdSig==='데드크로스')score-=10;if(amtB>=2000)score+=5;
var consYang=0;for(var ci=d.length-1;ci>=Math.max(0,d.length-5);ci--){if(d[ci].close>=d[ci].open)consYang++;else break}
                  var pullback='없음';if(d.length>=10){var maxR=0;for(var pi=d.length-10;pi<d.length-2;pi++){var r2=((d[pi].close-d[pi-1].close)/d[pi-1].close*100);if(r2>maxR)maxR=r2}if(maxR>=5&&today.close<=ma5*1.01&&today.close>=ma5*0.97&&today.close>ma20)pullback='눌림목(5일선)';}
                  var ydVolRatio=yest.volume>0?Math.round(today.volume/yest.volume*100):0;
                  if(consYang>=3)score+=10;
                  if(pullback==='눌림목(5일선)')score+=15;
                  if(ydVolRatio>=200)score+=5;
if(hitCount>=2)score+=20;
                  if(hitPull)score+=15;
                  if(hitGolden)score+=10;
                  if(hitGap&&today.close>today.open)score+=10;
                  var grade=score>=60?'A':score>=35?'B':'C';
                  found.push({symbol:sym,close:today.close,open:today.open,high:today.high,low:today.low,yClose:yest.close,changeRate:+cr.toFixed(1),prevRate:+pr.toFixed(1),amtB:amtB,ma5:Math.round(ma5),grade:grade,score:score,
                    posOpen:today.close>=today.open?'시가위':'시가아래',posMa5:today.close>=ma5?'5일선위':'5일선아래',
                    ma20:Math.round(ma20),posMa20:today.close>=ma20?'20일선위':'20일선아래',
                    rsi:rsi,volRatio:volRatio,candle:candle,gapPct:gapPct,gapType:gapType,macdSig:macdSig,
                    upperTail:upperTail,lowerTail:lowerTail,bodyPct:bodyPct,consYang:consYang,pullback:hitPull?'눌림목(5일선)':pullback,ydVolRatio:ydVolRatio,hitCount:hitCount,hitTags:(hitRise?'급등 ':'')+(hitPull?'눌림목 ':'')+(hitVol?'거래폭발 ':'')+(hitGolden?'골든크로스 ':'')+(hitGap?'갭상승 ':''),
                    stopPrice:Math.round(today.open*(1-dantaStop/100)),targetPrice:Math.round(today.close*(1+dantaTarget/100)),gapUp:today.open>yest.close});
                  setDantaResults([...found])}
                setTimeout(next,50)}).catch(()=>setTimeout(next,50))}next()
          }}>{dantaLoading?'스캔 중... '+dantaProg.cur+'/'+dantaProg.total:'⚡ 단타 후보 스캔'}</button></div>
        {dantaResults.length>0&&<div className="space-y-2">
          <div className="flex justify-between items-center"><h3 className="font-bold">🔥 단타 후보 ({dantaResults.length}개)</h3></div>
          <div className="flex gap-2 mb-2">{['전체','A','B','C'].map(g=>{var cnt=g==='전체'?dantaResults.length:dantaResults.filter(c=>c.grade===g).length;
            return <button key={g} onClick={()=>setDantaGrade(g)} className={'px-3 py-1 rounded-full text-xs font-bold '+(dantaGrade===g?'bg-blue-500 text-white':'bg-gray-100 text-gray-500')}>{g}({cnt})</button>})}</div>
          {dantaResults.filter(c=>dantaGrade==='전체'||c.grade===dantaGrade).map((c,i)=>{
            var gc=c.grade==='A'?'border-red-300 bg-red-50':c.grade==='B'?'border-yellow-300 bg-yellow-50':'border-gray-200 bg-white';
            return <div key={i} className={'rounded-2xl p-3 border shadow-sm '+gc}>
              <div className="flex justify-between items-center mb-2">
                <div className="flex items-center gap-2">
                  <span className={'text-xs font-bold px-2 py-0.5 rounded-full '+(c.grade==='A'?'bg-red-500 text-white':c.grade==='B'?'bg-yellow-500 text-white':'bg-gray-400 text-white')}>{c.grade}</span>
                  <span className="font-bold text-sm">{c.symbol}</span>{c.hitCount>=2&&<span className="text-xs ml-1 px-1.5 py-0.5 rounded-full bg-purple-500 text-white font-bold">{c.hitCount}중복</span>}</div>
                <div className="flex gap-1">
                  <button onClick={()=>showChart(c.symbol,'day')} className="text-xs px-2 py-1 rounded-full bg-blue-100 text-blue-600 font-bold">차트</button>
                  <button onClick={()=>{setMenu('sim');setTimeout(()=>{var el=document.getElementById('simSym');if(el){el.value=c.symbol;el.focus()}},100)}} className="text-xs px-2 py-1 rounded-full bg-green-100 text-green-600 font-bold">모의매수</button></div></div>
              <div className="grid grid-cols-4 gap-2 text-xs">
                <div><span className="text-gray-400">현재가 </span><span className="font-bold">{c.close.toLocaleString()}</span></div>
                <div><span className="text-gray-400">당일 </span><span className={(c.changeRate>=0?'text-red-500':'text-blue-500')+' font-bold'}>{(c.changeRate>0?'+':'')+c.changeRate}%</span></div>
                <div><span className="text-gray-400">전일 </span><span className="text-red-500 font-bold">+{c.prevRate}%</span></div>
                <div><span className="text-gray-400">거래대금 </span><span className="text-yellow-600 font-bold">{c.amtB}억</span></div></div>
              <div className="grid grid-cols-4 gap-2 text-xs mt-1">
                <div><span className="text-gray-400">시가위치 </span><span className={c.posOpen==='시가위'?'text-red-500':'text-blue-500'}>{c.posOpen}</span></div>
                <div><span className="text-gray-400">5일선 </span><span className={c.posMa5==='5일선위'?'text-red-500':'text-blue-500'}>{c.posMa5}</span></div>
                <div><span className="text-gray-400">손절 </span><span className="text-blue-500 font-bold">{c.stopPrice.toLocaleString()}</span></div>
                <div><span className="text-gray-400">목표 </span><span className="text-red-500 font-bold">{c.targetPrice.toLocaleString()}</span></div></div>
<div className="grid grid-cols-4 gap-2 text-xs mt-1 bg-gray-50 rounded-lg p-2">

<h3 className="font-bold text-gray-700 mb-2">📖 점수 가이드</h3>

<div className="space-y-4 text-sm text-gray-700 leading-relaxed">
<div className="bg-blue-50 rounded-xl p-4">
<h3 className="font-bold text-blue-700 mb-2">📊 총점 = 4가지 영역의 가중합 (100점 만점) ⚠️ 휴리스틱</h3>
<p>재무 데이터 있을 때: 추세 35% + 모멘텀 25% + 거래량 20% + 재무 20%</p>
<p>재무 데이터 없을 때: 추세 40% + 모멘텀 30% + 거래량 30%</p>
<p className="text-xs text-red-600 font-bold mt-2 leading-relaxed font-bold">⚠️ 가중치는 통계검증 미실시 · 주관적 휴리스틱. 70점↑이라도 매수 신호 아님.</p>
</div>
<div className="bg-green-50 rounded-xl p-4">
<h3 className="font-bold text-green-700 mb-2">📈 1. 추세 점수 (Trend)</h3>
<p>• 12개월 이동평균선(12MA) 위치 및 골든/데드크로스</p>
<p>• 이평선 정배열(5일&gt;20일&gt;60일) → 가산 / 역배열 → 감점</p>
<p>• ADX 25이상 = 강한 추세, 15미만 = 추세 약함</p>
</div>
<div className="bg-yellow-50 rounded-xl p-4">
<h3 className="font-bold text-yellow-700 mb-2">⚡ 2. 모멘텀 점수 (Momentum)</h3>
<p>• RSI 70↑ 과매수(주의) / RSI 30↓ 과매도(기회)</p>
<p>• StochRSI 80↑ 감점 / 20↓ 가점</p>
<p>• RSI 상승다이버전스 +15점 / 하락다이버전스 -15점</p>
<p>• MACD 골든크로스 +15점 / 데드크로스 -15점</p>
</div>
<div className="bg-purple-50 rounded-xl p-4">
<h3 className="font-bold text-purple-700 mb-2">📊 3. 거래량 점수 (Volume)</h3>
<p>• 20일 평균 대비 거래량 비율로 계산</p>
<p>• 상승 + 거래폭발(300%↑) = 90점 / 하락 + 폭발 = 20점</p>
<p>• OBV 상승다이버전스 +10점 / 하락다이버전스 -10점</p>
</div>
<div className="bg-red-50 rounded-xl p-4">
<h3 className="font-bold text-red-700 mb-2">💰 4. 재무 점수 (Financial)</h3>
<p>• DART API에서 PER, PBR, 매출, 영업이익 등 조회</p>
<p>• 저PER/저PBR → 가산, 영업이익 증가 → 가산</p>
<p>• 데이터 없으면 나머지 3개 영역으로 재배분</p>
</div>
<div className="bg-gray-50 rounded-xl p-4">
<h3 className="font-bold text-gray-700 mb-2">🎯 최종 판정 기준</h3>
<p>🟢 80점↑ 강력매수 / 🟢 65점↑ 매수고려 / 🟡 50점↑ 관망</p>
<p>🟠 35점↑ 매도고려 / 🔴 35점↓ 매도·손절</p>
</div>
<div className="bg-indigo-50 rounded-xl p-4">
<h3 className="font-bold text-indigo-700 mb-2">📉 차트 지표 설명</h3>
<p>• <span style={{color:'#f59e0b'}}>■</span> 5일선: 초단기 추세 (1주일)</p>
<p>• <span style={{color:'#22c55e'}}>■</span> 20일선: 단기 추세 (1개월)</p>
<p>• <span style={{color:'#3b82f6'}}>■</span> 60일선: 중기 추세 (3개월)</p>
<p>• <span style={{color:'#a855f7'}}>■</span> 120일선: 장기 추세 (6개월)</p>
<p>• <span style={{color:'#ef4444'}}>■</span> 12개월선: 월봉 장기 추세 (1년)</p>
<p>• R62% / S79%: 피보나치 저항선/지지선 — 가격이 반등하거나 막힐 가능성이 높은 구간</p>
<p>• <span style={{color:'rgba(139,92,246,0.6)'}}>- - -</span> BB상/하 (보라 점선): 볼린저밴드 상단·하단</p>
<p className="ml-4 text-gray-600">  → 주가가 상단 돌파 = 과매수(조정 주의), 하단 이탈 = 과매도(반등 기회)</p>
<p className="ml-4 text-gray-600">  → 밴드 폭이 좁아지면(수축) 곧 큰 움직임 예상, 넓어지면 변동성 확대 중</p>
<p className="ml-4 text-gray-600">  → 주가는 보통 상단~하단 사이에서 움직이며, 중심선(20일선)이 기준</p>
</div>
<div className="bg-orange-50 rounded-xl p-4">
<h3 className="font-bold text-orange-700 mb-2">🧪 백테스트 결과 해석</h3>
<p>• <b>Buy&Hold</b>: 단순 보유 시 수익률. 아무 전략 없이 사서 들고만 있었을 때의 결과</p>
<p>• <b>Alpha</b>: 앱 전략이 단순 보유 대비 얼마나 더 좋은 성과를 냈는지. (+)면 전략이 시장을 이김</p>
<p>• <b>MDD</b>: 최대 낙폭(Maximum Drawdown). 가장 크게 떨어진 구간. 작을수록 안정적</p>
<p>• <b>Sharpe</b>: 위험 대비 수익률. 1↑ 양호 / 2↑ 우수 / 0↓ 나쁨</p>
</div>
<div className="bg-teal-50 rounded-xl p-4">
<h3 className="font-bold text-teal-700 mb-2">📊 재무 지표 상대 비교</h3>
<p>• <span className="text-green-600 font-bold">▲우수</span>: 업종 공통 기준 대비 좋음 (ROE 10%↑, 부채 80%↓, 영익률 15%↑ 등)</p>
<p>• <span className="text-gray-500 font-bold">─보통</span>: 기준 범위 안에 있음</p>
<p>• <span className="text-red-500 font-bold">▼부진</span>: 기준 대비 부족 (ROE 3%↓, 부채 150%↑, 영익률 5%↓ 등)</p>
<p>• <span className="text-green-600 font-bold">▲상위</span> / <span className="text-red-500 font-bold">▼하위</span>: 같은 섹터 종목이 2개 이상일 때 섹터 평균과 비교한 결과</p>
</div>
<div className="bg-pink-50 rounded-xl p-4">
<h3 className="font-bold text-pink-700 mb-2">🏷️ 신호 배지 해석</h3>
<p>• <b>⚡bearish (하락다이버전스)</b>: 주가는 오르는데 RSI는 하락 → 상승세 약화 경고, 조정 가능성</p>
<p>• <b>⚡bullish (상승다이버전스)</b>: 주가는 내리는데 RSI는 상승 → 하락세 약화, 반등 가능성</p>
<p>• <b>MACD 골든크로스</b>: MACD가 시그널선을 상향돌파 → 매수 신호</p>
<p>• <b>MACD 데드크로스</b>: MACD가 시그널선을 하향돌파 → 매도 신호</p>
<p>• <b>12MA 골든크로스</b>: 주가가 12개월 이평선을 상향돌파 → 장기 상승 전환</p>
<p>• <b>12MA 데드크로스</b>: 주가가 12개월 이평선을 하향돌파 → 장기 하락 전환</p>
<p>• <b>12MA위 +00%</b>: 현재 가격이 12개월 이평선보다 00% 위에 있음</p>
<p>• <b>12MA아래 -00%</b>: 현재 가격이 12개월 이평선보다 00% 아래에 있음</p>
<p>• <b>RSI 과매수 (70↑)</b>: 과열 상태, 단기 조정 주의</p>
<p>• <b>RSI 과매도 (30↓)</b>: 침체 상태, 반등 기회 가능</p>
<p>• <b>거래량폭발</b>: 20일 평균 대비 300%↑, 상승 시 매수 신호 / 하락 시 경고</p>
<p>• <b>거래량부족</b>: 20일 평균 대비 80%↓, 추세 조건 충족도 낮음</p>
<p>• <b>OBV 상승/하락다이버전스</b>: 거래량 흐름과 가격 흐름의 괴리 → 추세 전환 가능</p>
<p>• <b>BB상단돌파</b>: 볼린저밴드 상단 돌파 → 과매수 주의</p>
<p>• <b>BB하단근접</b>: 볼린저밴드 하단 근접 → 반등 기회</p>
<p>• <b>BB수축</b>: 볼린저밴드 폭이 좁아짐 → 곧 큰 변동 예상</p>
<p>• <b>ADX 25↑ 강추세</b>: 현재 추세가 강함 (방향은 별도 확인)</p>
<p>• <b>ADX 15↓ 추세약</b>: 뚜렷한 방향 없이 횡보 중</p>
</div>
<div className="bg-cyan-50 rounded-xl p-4">
<h3 className="font-bold text-cyan-700 mb-2">💡 실전 활용 팁</h3>
<p>• <b>TOP 30 1위</b> = 현재 가장 높은 종합 점수, 하지만 경고 신호도 반드시 확인</p>
<p>• <b>RSI 하락다이버전스 + ADX 강추세</b> = 강한 상승 중이지만 조정 임박 가능 → 신규 매수 주의</p>
<p>• <b>RSI 상승다이버전스 + 12MA아래</b> = 하락 중이지만 반등 가능성 → 분할 매수 고려</p>
<p>• <b>MACD 골든크로스 + 거래량폭발</b> = 강한 매수 신호, 추세 전환 가능성 높음</p>
<p>• <b>12MA 골든크로스</b> = 장기 상승 전환, 중장기 투자에 유리한 진입 시점</p>
<p>• <b>BB수축 후 상단돌파 + 거래량↑</b> = 횡보 탈출 후 상승 시작 가능성</p>
</div>
<div className="bg-rose-50 rounded-xl p-4">
<h3 className="font-bold text-rose-700 mb-2">🎯 매매 참고가 (손절가/목표가)</h3>
<p>• <b>손절가</b>: 피보나치 지지선(S79%) 가격에서 -3%. 이 아래로 떨어지면 손절 고려</p>
<p>• <b>목표가</b>: 피보나치 저항선(R62%) 가격에서 +3%. 이 위로 오르면 익절 고려</p>
<p>• <b>손익비</b>: 목표수익 ÷ 손실위험. 1:2 이상이면 유리한 매매 (B등급 이상)</p>
<p>• <b>위험도</b>: 현재가 대비 손절가까지의 하락폭. 5% 이하 안전, 10% 이상 위험</p>
<p>• <b>권장비중</b>: 손익비와 위험도 기반 포트폴리오 배분 비율. 투자금 전체 대비 이 종목에 넣을 %</p>
</div>

<div className="bg-violet-50 rounded-xl p-4">
<h3 className="font-bold text-violet-700 mb-2">🌡️ 시장환경 보정</h3>
<p>• 대시보드에서 <b>시장환경 새로고침</b>을 먼저 클릭해야 보정이 적용됩니다</p>
<p>• <b>온도 70↑ (과열)</b>: 모든 종목 점수 -10% 보정. 신규 매수 자제, 익절 고려</p>
<p>• <b>온도 60~70 (낙관)</b>: 모든 종목 점수 -5% 보정. 추격매수 주의</p>
<p>• <b>온도 40~60 (중립)</b>: 보정 없음. 개별 종목 판단대로 매매</p>
<p>• <b>온도 30~40 (비관)</b>: 모든 종목 점수 +5% 보정. 우량주 분할매수 고려</p>
<p>• <b>온도 30↓ (공포)</b>: 모든 종목 점수 +10% 보정. 역사적 저점 매수 기회</p>
<p>• 종목 카드의 신호 배지에 <b>"시장낙관 -5%보정"</b> 등으로 표시됩니다</p>
</div>

<div className="bg-teal-50 rounded-xl p-4">
<h3 className="font-bold text-teal-700 mb-2">🔀 멀티 전략 백테스트</h3>
<p>• 백테스트 실행 시 <b>3가지 전략</b>을 동시에 비교합니다:</p>
<p>• <b>12MA</b>: 12개월 이동평균선 돌파/이탈 시 매수/매도</p>
<p>• <b>RSI(30/70)</b>: RSI 30 이하에서 매수, 70 이상에서 매도 (과매도/과매수 전략)</p>
<p>• <b>MACD</b>: MACD 골든크로스에서 매수, 데드크로스에서 매도</p>
<p>• 여러 전략이 동시에 수익이면 해당 종목의 매매 조건 충족도가 높습니다 (확률 보장은 아님)</p>
<p>• <b>기간별 성과 비교</b>(6개월/1년/2년)에서 Alpha가 모두 (+)이면 전략 일관성 높음</p>
</div>

<div className="bg-pink-50 rounded-xl p-4">
<h3 className="font-bold text-pink-700 mb-2">🎮 모의투자 사용법</h3>
<p>• 가상 자금 <b>1,000만원</b>으로 실제 주가 기반 모의 매매를 합니다</p>
<p>• <b>모의 매수</b>: 종목명과 수량 입력 → 매수 버튼. 현재 실시간 주가로 체결</p>
<p>• <b>모의 매도</b>: 보유종목 옆 매도 버튼 클릭. 현재 주가로 매도 체결</p>
<p>• <b>총평가액</b> = 보유현금 + 보유주식 평가금액</p>
<p>• <b>총수익률</b> = (총평가액 - 원금 1000만원) / 원금 × 100</p>
<p>• 실전 투자 전에 최소 1~2개월 모의투자로 전략을 검증하세요</p>
<p>• <b>초기화</b> 버튼으로 언제든 리셋 가능합니다</p>
</div>

<div className="bg-amber-50 rounded-xl p-4">
<h3 className="font-bold text-amber-700 mb-2">✅ 매매 체크리스트</h3>
<p>• 보유 등록 시 <b>5가지 체크항목</b>을 모두 확인해야 등록됩니다:</p>
<p>• 📈 <b>추세</b>: 12MA 위치와 이평선 정배열(5>20>60) 확인</p>
<p>• 🛑 <b>손절</b>: 손절가를 미리 설정하고 지킬 수 있는지 확인</p>
<p>• 🌡️ <b>시장</b>: 시장 환경(온도)이 과열이 아닌지 확인</p>
<p>• ⚖️ <b>비중</b>: 전체 투자금 대비 이 종목 비중이 적정한지 확인</p>
<p>• 📝 <b>근거</b>: 감이 아닌 점수/신호/차트 데이터 근거가 있는지 확인</p>
<p>• 충동 매매를 방지하고 체계적 투자 습관을 만들어 줍니다</p>
</div>

<div className="bg-sky-50 rounded-xl p-4">
<h3 className="font-bold text-sky-700 mb-2">🏆 동종 업종 비교</h3>
<p>• 섹터 스캔 후 종목 카드 하단에 <b>같은 섹터 순위표</b>가 표시됩니다</p>
<p>• 점수 높은 순으로 정렬되어 섹터 내 최고 종목을 쉽게 확인</p>
<p>• 1위 종목과의 점수 차이도 표시되어 상대적 위치를 파악할 수 있습니다</p>
<p>• 같은 업종에서 점수가 가장 높은 종목이 투자 우선 후보입니다</p>
</div>

</div>
<div className="bg-gray-100 rounded-xl p-4">
<h3 className="font-bold text-gray-700 mb-2">📖 점수 가이드</h3><p>① 대시보드에서 <b>시장환경 확인</b> (온도 60 이하가 매수에 유리)</p>

<p>③ 관심 종목의 <b>점수 산출 근거</b>와 <b>신호 배지</b> 확인</p>

<p>⑤ <b>동종 업종 비교</b>에서 섹터 내 순위 확인</p>
<p>⑥ <b>매매 참고가</b>에서 손절가/목표가/손익비 확인</p>
<p>⑦ <b>모의투자</b>로 1~2개월 실전 시뮬레이션</p>
<p>⑧ 실전 매매 시 <b>체크리스트</b> 5개 항목 모두 확인 후 진입</p>

<div className="bg-emerald-50 rounded-xl p-4">
<h3 className="font-bold text-emerald-700 mb-2">🕯️ 캔들 패턴 감지</h3>
<p>• 최근 3일(오늘/어제/2일전) 캔들을 자동 분석하여 12가지 패턴을 감지합니다</p>
<p>• <b>상승장악형 (85%)</b>: 하락 후 대형 양봉이 전일 음봉을 감쌈 → 강력 반전, 분할 매수</p>
<p>• <b>하락장악형 (85%)</b>: 상승 후 대형 음봉이 전일 양봉을 감쌈 → 하락 전환, 비중 축소</p>
<p>• <b>모닝스타 (90%)</b>: 대형음봉→소형봉→대형양봉 → 가장 역사적 빈도 높은 3봉 반전</p>
<p>• <b>이브닝스타 (90%)</b>: 대형양봉→소형봉→대형음봉 → 강력 고점 반전</p>
<p>• <b>망치형 (70%)</b>: 긴 아래꼬리, 하락 중 매수세 유입 → 다음 봉 양봉 확인 후 매수</p>
<p>• <b>유성형 (70%)</b>: 긴 위꼬리, 상승 중 매도세 유입 → 추격 매수 금지</p>
<p>• <b>쓰리화이트솔저 (80%)</b>: 3일 연속 양봉 상승 → 추세 추종 매수</p>
<p>• <b>쓰리블랙크로우 (80%)</b>: 3일 연속 음봉 하락 → 즉시 매도</p>
<p>• <b>하라미 (60%)</b>: 대형봉 안에 소형봉 → 추세 둔화, 다음 봉 확인 필요</p>
<p>• <b>도지 (55%)</b>: 시가≈종가, 힘의 균형 → 추세 전환 가능성</p>
<p>• <b>대형양봉+거래량 (75%)</b>: 평균 1.8배 큰 양봉 + 거래량 증가 → 강한 매수세</p>
<p>• <b>대형음봉+거래량 (75%)</b>: 평균 1.8배 큰 음봉 + 거래량 증가 → 강한 매도세</p>
<p>• 역사적 빈도(%)는 과거 통계치이며, 미래 예측 정확도를 보장하지 않습니다</p>
</div>

<div className="bg-red-50 rounded-xl p-4">
<h3 className="font-bold text-red-700 mb-2">🔥 복합 진입 신호 시스템</h3>
<p>• RSI + MACD + 거래량 + 캔들패턴 + 추세를 <b>동시에 분석</b>합니다</p>
<p>• <b>🔥 강력 매수 신호 (95%)</b>: 3개 이상 조건 동시 충족 → 적극 분할 매수 진입</p>
<p>• <b>⚡ 매수 주의 신호 (75%)</b>: 2개 조건 충족 → 관망 후 추가 확인 시 소량 매수</p>
<p>• <b>🔥 강력 매도 신호 (95%)</b>: 3개 이상 매도 조건 → 즉시 익절 또는 전량 매도</p>
<p>• <b>⚡ 매도 주의 신호 (75%)</b>: 2개 매도 조건 → 비중 축소, 손절라인 조정</p>
<p>• <b>진입 조건 5가지</b>:</p>
<p className="ml-4">① RSI 40↓ 과매도(매수) / RSI 70↑ 과매수(매도)</p>
<p className="ml-4">② MACD 골든크로스(매수) / 데드크로스(매도)</p>
<p className="ml-4">③ 거래량 150%↑ 급증</p>
<p className="ml-4">④ 강한 캔들 패턴(역사적 빈도 70%↑)</p>
<p className="ml-4">⑤ 하락추세 반등(매수) / 상승추세 눌림(매도)</p>
<p>• 매수·매도 신호가 동시에 뜨면 <b>"급등 후 단기 과열"</b> → 신규 진입보다 보유자 익절</p>
</div>

<div className="bg-blue-50 rounded-xl p-4">
<h3 className="font-bold text-blue-700 mb-2">📊 애널리스트 컨센서스</h3>
<p>• 네이버 증권의 <b>증권사 애널리스트 리포트</b>를 자동 수집하여 표시합니다</p>
<p>• <b>목표가</b>: 증권사들의 평균 목표주가. 현재가와의 차이(괴리율)로 상승 여력 판단</p>
<p>• <b>괴리율 +30%↑</b>: 상승 여력 큼, <b>괴리율 -10%↓</b>: 이미 고평가 가능성</p>
<p>• <b>평점</b>: 5점 만점. 4↑ 강력매수 / 3~4 매수 / 3↓ 중립~매도</p>
<p>• <b>외인보유율</b>: 외국인 투자자 비중. 30%↑이면 외국인 선호 우량주</p>
<p>• <b>PER/추정PER</b>: 현재 PER이 높아도 추정PER이 낮으면 실적 개선 기대</p>
<p>• <b>배당수익률</b>: 장기 보유 시 추가 수익. 3%↑이면 배당주로 매력적</p>
<p>• <b>52주 범위</b>: 1년 최고/최저가. 현재가가 최저에 가까우면 저점 매수 기회</p>
</div>

<div className="bg-amber-50 rounded-xl p-4">
<h3 className="font-bold text-amber-700 mb-2">📱 정렬 및 알림 기능</h3>
<p>• 스캔 결과는 <b>매수 조건이 좋은 종목 순</b>으로 자동 정렬됩니다</p>
<p>• 🔥강력매수 신호 종목 → ⚡매수주의 신호 → 캔들 매수패턴 → 일반 점수 순</p>
<p>• 🔥강력매도 신호가 있는 종목은 순위가 하락합니다</p>
<p>• <b>관심종목 알림</b>: 10분마다 자동으로 목표가/손절가/외인매도/IR일정을 체크</p>
<p>• <b>외인 대량매도</b>: 외국인 순매도 50만주↑ 시 경고 알림</p>
<p>• <b>IR 일정</b>: 실적 발표 7일 이내 접근 시 알림 (실적 발표 전후 변동성 주의)</p>
</div>

<div className="bg-lime-50 rounded-xl p-4">
<h3 className="font-bold text-lime-700 mb-2">⚠️ 투자 유의사항</h3>
<p>• 이 앱의 분석은 <b>참고용</b>이며 투자 판단의 최종 책임은 본인에게 있습니다</p>
<p>• 어떤 기술적 분석도 <b>100% 정확하지 않습니다</b>. 반드시 분산 투자하세요</p>
<p>• 단타는 전문가도 승률 50~60%입니다. <b>모의투자 2~3개월</b> 후 실전 진입하세요</p>
<p>• 전체 자산의 <b>10% 이내</b>만 단타에 사용하고, 나머지는 장기 우량주/ETF에 배분</p>
<p>• <b>손절라인을 반드시 지키세요</b>. 손절 못 하면 어떤 전략도 소용없습니다</p>
<p>• 급등주 추격 매수는 가장 위험합니다. 눌림목에서 분할 매수가 안전합니다</p>
</div>

</div>

</div>}
        </div>}

        <div className="bg-gradient-to-r from-indigo-50 to-purple-50 rounded-2xl p-5 mt-4 border border-indigo-200">
          <h3 className="text-lg font-bold text-indigo-800 mb-3">🚀 다종목 일괄 백테스트 (30종목)</h3>
          <p className="text-xs text-gray-600 mb-3">한국 대형주 30종목 또는 미국 대형주 30종목을 동시에 백테스트하여 전략 유효성을 검증합니다.</p>
          <div className="flex gap-2 mb-3">
            <button onClick={()=>{
              if(batchRunning)return;
              setBatchRunning(true);setBatchResults([]);setBatchProgress('');
              batchBacktest('kr',function(p){
                if(p.done){setBatchRunning(false);setBatchResults(p.results);setBatchProgress('완료! '+p.results.length+'종목');}
                else{setBatchProgress(p.current+'/'+p.total+' '+p.symbol+' 분석중...');}
              });
            }} disabled={batchRunning} className={'px-4 py-2 rounded-xl text-sm font-bold '+(batchRunning?'bg-gray-300':'bg-indigo-600 text-white hover:bg-indigo-700')}>
              🇰🇷 한국 30종목 백테스트
            </button>
            <button onClick={()=>{
              if(batchRunning)return;
              setBatchRunning(true);setBatchResults([]);setBatchProgress('');
              batchBacktest('us',function(p){
                if(p.done){setBatchRunning(false);setBatchResults(p.results);setBatchProgress('완료! '+p.results.length+'종목');}
                else{setBatchProgress(p.current+'/'+p.total+' '+p.symbol+' 분석중...');}
              });
            }} disabled={batchRunning} className={'px-4 py-2 rounded-xl text-sm font-bold '+(batchRunning?'bg-gray-300':'bg-blue-600 text-white hover:bg-blue-700')}>
              🇺🇸 미국 30종목 백테스트
            </button>
          </div>
          {batchProgress&&<p className="text-sm font-bold text-indigo-700 mb-2">{batchRunning?'⏳':'✅'} {batchProgress}</p>}
          {batchResults.length>0&&<div>
            <div className="grid grid-cols-3 gap-2 mb-3">
              <div className="bg-white rounded-xl p-3 text-center">
                <p className="text-xs text-gray-500">평균 수익률</p>
                <p className={'text-xl font-bold '+(batchResults.reduce((a,b)=>a+b.totalReturn,0)/batchResults.length>=0?'text-red-500':'text-blue-500')}>
                  {(batchResults.reduce((a,b)=>a+b.totalReturn,0)/batchResults.length).toFixed(1)}%
                </p>
              </div>
              <div className="bg-white rounded-xl p-3 text-center">
                <p className="text-xs text-gray-500">평균 승률</p>
                <p className="text-xl font-bold">{(batchResults.filter(r=>r.trades>0).reduce((a,b)=>a+b.winRate,0)/(batchResults.filter(r=>r.trades>0).length||1)).toFixed(1)}%</p>
              </div>
              <div className="bg-white rounded-xl p-3 text-center">
                <p className="text-xs text-gray-500">수익 종목</p>
                <p className="text-xl font-bold text-red-500">{batchResults.filter(r=>r.totalReturn>0).length}/{batchResults.length}</p>
              </div>
            </div>
            <div className="overflow-x-auto"><table className="w-full text-xs">
              <thead><tr className="border-b bg-indigo-100">
                {['종목','거래수','승률','수익률','MDD','Alpha'].map((h,i)=><th key={i} className="py-2 px-1 text-center">{h}</th>)}
              </tr></thead>
              <tbody>{batchResults.sort((a,b)=>b.totalReturn-a.totalReturn).map((r,i)=><tr key={i} className={'border-b '+(r.error?'bg-gray-50':'')}>
                <td className="py-1 px-1 font-bold">{r.symbol}</td>
                <td className="py-1 px-1 text-center">{r.trades}</td>
                <td className="py-1 px-1 text-center">{r.winRate}%</td>
                <td className={'py-1 px-1 text-center font-bold '+(r.totalReturn>=0?'text-red-500':'text-blue-500')}>{r.totalReturn>0?'+':''}{r.totalReturn}%</td>
                <td className="py-1 px-1 text-center text-blue-500">-{r.maxDrawdown}%</td>
                <td className={'py-1 px-1 text-center '+(r.alpha>=0?'text-green-600':'text-red-500')}>{r.alpha>0?'+':''}{r.alpha}%</td>
              </tr>)}</tbody>
            </table></div>
          </div>}
        </div>

      </div>}

      {/* 설정 */}      {menu==='settings'&&<div className="space-y-4">
        <h2 className="text-lg font-bold">⚙️ 설정</h2>
        <div className="bg-white rounded-2xl p-4 shadow-lg">
          <h3 className="font-bold mb-3">💰 DART 연동</h3>
          <div className="flex gap-2 mb-3">
            <input type="password" value={dartKeyInput} onChange={e=>setDartKeyInput(e.target.value)} placeholder="DART API 키" className="flex-1 px-4 py-3 border-2 border-gray-200 rounded-xl text-sm font-mono focus:border-emerald-500 focus:outline-none"/>
            <button onClick={()=>{var k=dartKeyInput.trim();if(k.length>=30){setDartKey(k);setDartStatus('설정됨');showToast('✅ 저장!')}else showToast('키 오류')}} className="px-4 py-3 rounded-xl font-bold text-white bg-emerald-500">저장</button></div>
          <div className="flex items-center gap-2"><span className={'status-dot '+(dartStatus==='설정됨'?'status-online':'status-offline')}/>
            <span className="text-sm">{dartStatus==='설정됨'?'✅ 활성화':'❌ 미연동'}</span></div></div>
        <div className="bg-white rounded-2xl p-4 shadow-lg">
          <h3 className="font-bold mb-3">🧮 리스크 관리 기본값</h3>
          <div className="grid grid-cols-3 gap-2">
            <div><p className="text-xs text-gray-500 mb-1">총 투자금</p><input type="number" value={accountSize} onChange={e=>setAccountSize(Number(e.target.value)||0)} className="w-full px-3 py-2 border-2 border-gray-200 rounded-xl text-sm font-bold"/></div>
            <div><p className="text-xs text-gray-500 mb-1">1회 허용손실 %</p><input type="number" step="0.1" value={riskPerTradePct} onChange={e=>setRiskPerTradePct(Number(e.target.value)||0)} className="w-full px-3 py-2 border-2 border-gray-200 rounded-xl text-sm font-bold"/></div>
            <div><p className="text-xs text-gray-500 mb-1">기본 손절 %</p><input type="number" step="0.1" value={defaultStopPct} onChange={e=>setDefaultStopPct(Number(e.target.value)||0)} className="w-full px-3 py-2 border-2 border-gray-200 rounded-xl text-sm font-bold"/></div>
          </div>
          <p className="text-xs text-gray-500 mt-2">단일 종목 분석 화면의 포지션 사이징 계산기에 바로 반영됩니다. 계좌 총액·1회 허용손실·기본 손절폭을 기준으로 권장 수량을 계산합니다.</p></div>
        <div className="bg-white rounded-2xl p-4 shadow-lg">
          <h3 className="font-bold mb-3">💾 백업</h3>
          <div className="flex gap-2">
            <button onClick={()=>{exportBackup({holdings:holdings,watchlist:watchlist,simState:{balance:simBalance,holdings:simHoldings,history:simHistory},riskSettings:{accountSize:accountSize,riskPerTradePct:riskPerTradePct,defaultStopPct:defaultStopPct}});showToast('📦 다운로드!')}} className="flex-1 py-3 rounded-2xl font-bold text-white bg-blue-500">📤 내보내기</button>
            <button onClick={()=>fileInputRef.current?.click()} className="flex-1 py-3 rounded-2xl font-bold text-white bg-green-500">📥 불러오기</button></div></div>
        <div className="bg-white rounded-2xl p-4 shadow-lg">
          <h3 className="font-bold mb-3">🗑️ 초기화</h3>
          <div className="flex gap-2">
            <button onClick={()=>{if(confirm('보유종목 삭제?')){setHoldings([]);setHoldingResults([]);showToast('삭제')}}} className="flex-1 py-3 rounded-2xl font-bold text-red-600 bg-red-50 border border-red-200">보유 삭제</button>
            <button onClick={()=>{if(confirm('DART 키 삭제?')){setDartKey('');setDartKeyInput('');setDartStatus('미설정');showToast('삭제')}}} className="flex-1 py-3 rounded-2xl font-bold text-orange-600 bg-orange-50 border border-orange-200">DART 삭제</button></div></div>
        <div className="bg-white rounded-2xl p-4 shadow-lg">
          <h3 className="font-bold mb-3">🔍 신호 설명</h3>
          <div className="flex flex-wrap gap-2">{Object.keys(SIG_EXPLAIN).map(k=>{var info=SIG_EXPLAIN[k];
            var bg=info.level==='danger'?'bg-red-100 text-red-700':info.level==='success'?'bg-green-100 text-green-700':info.level==='warning'?'bg-orange-100 text-orange-700':'bg-blue-100 text-blue-700';
            return <button key={k} className={'sig-badge-btn px-2 py-1 rounded-lg text-xs font-bold '+bg} onClick={()=>setExplainSignal(k)}>{info.icon} {info.title}</button>})}</div></div>
      </div>}

      {/* 프롬프트 */}
      {promptText&&<div className="mt-6 bg-white rounded-2xl p-4 shadow-lg fade-in">
        <div className="flex justify-between items-center mb-3"><h3 className="font-bold">✨ AI 프롬프트</h3>
          <button onClick={()=>copyText(promptText)} className="bg-blue-500 text-white px-4 py-2 rounded-xl text-sm font-bold">📋 복사</button></div>
        <textarea value={promptText} readOnly className="w-full h-48 bg-gray-50 border-2 border-gray-200 rounded-xl p-3 text-xs font-mono resize-none"/>
        <div className="flex gap-2 mt-3">
          <button onClick={()=>{copyText(promptText);setTimeout(()=>window.open(GENSPARK_CHAT_URL,'_blank'),500)}} className="flex-1 bg-indigo-600 text-white py-3 rounded-2xl font-bold text-sm">🚀 Genspark</button>
          <button onClick={()=>copyText(promptText)} className="flex-1 bg-gray-800 text-white py-3 rounded-2xl font-bold text-sm">📋 복사</button></div></div>}
      <div className="mt-8 text-center"><p className="text-xs text-gray-400">AI v6.2</p></div>
    </div>
  </div>
}
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);</script>
<script>
// 페이지 로드 시 자동으로 시장환경 감지 (B점수 강세장 안내용)
(function(){
  function loadMarketRegime(){
    if(typeof fetchKrD !== 'function'){
      setTimeout(loadMarketRegime, 1000);
      return;
    }
    fetchKrD('KODEX 200').then(function(d){
      if(!d || d.length < 31) return;
      var curr = d[d.length-1].close;
      var past = d[d.length-31].close;
      var ret30 = (curr - past) / past * 100;
      var regime, label, recommend;
      if(ret30 >= 10){ regime='bull'; label='🔥 강세장'; recommend='B점수'; }
      else if(ret30 <= -5){ regime='bear'; label='❄️ 약세장'; recommend='V점수'; }
      else { regime='sideways'; label='➖ 횡보장'; recommend='종합'; }
      window.__marketRegime = {regime:regime, label:label, recommend:recommend, ret30: +ret30.toFixed(2)};
      console.log('🌍 시장환경 자동감지:', window.__marketRegime);
    }).catch(function(e){
      console.warn('시장환경 감지 실패:', e.message);
    });
  }
  if(document.readyState === 'complete'){
    setTimeout(loadMarketRegime, 2000);
  } else {
    window.addEventListener('load', function(){
      setTimeout(loadMarketRegime, 2000);
    });
  }
})();
</script>
</body>
</html>
